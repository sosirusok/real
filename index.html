  { e: -10, zen: [0.012, 0.024, 0.07], hor: [0.07, 0.07, 0.13], glow: [0.18, 0.08, 0.12], sun: [0.55, 0.66, 0.95], si: 0.22, env: 0.6, exp: 1.35, fog: 0.00036 },
  { e: -3, zen: [0.035, 0.07, 0.19], hor: [0.42, 0.24, 0.22], glow: [0.95, 0.32, 0.14], sun: [1.0, 0.42, 0.18], si: 0.2, env: 0.65, exp: 1.15, fog: 0.00028 },
  { e: 2, zen: [0.08, 0.16, 0.38], hor: [0.95, 0.52, 0.30], glow: [1.6, 0.62, 0.22], sun: [1.0, 0.50, 0.22], si: 2.2, env: 0.72, exp: 0.88, fog: 0.00030 },
  { e: 8, zen: [0.12, 0.26, 0.56], hor: [0.95, 0.72, 0.52], glow: [1.25, 0.72, 0.36], sun: [1.0, 0.68, 0.40], si: 3.0, env: 0.85, exp: 0.82, fog: 0.00026 },
  { e: 20, zen: [0.11, 0.28, 0.66], hor: [0.66, 0.74, 0.84], glow: [0.7, 0.6, 0.45], sun: [1.0, 0.86, 0.70], si: 3.4, env: 0.95, exp: 0.86, fog: 0.00021 },
  { e: 45, zen: [0.08, 0.25, 0.66], hor: [0.55, 0.68, 0.86], glow: [0.5, 0.5, 0.45], sun: [1.0, 0.95, 0.88], si: 3.7, env: 1.0, exp: 0.84, fog: 0.00018 },
  { e: 90, zen: [0.07, 0.23, 0.64], hor: [0.52, 0.66, 0.86], glow: [0.45, 0.45, 0.42], sun: [1.0, 0.97, 0.93], si: 3.8, env: 1.0, exp: 0.84, fog: 0.00017 },
];
function skyPalette(elevDeg) {
  let a = SKY_KEYS[0], b = SKY_KEYS[SKY_KEYS.length - 1];
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    if (elevDeg >= SKY_KEYS[i].e && elevDeg <= SKY_KEYS[i + 1].e) { a = SKY_KEYS[i]; b = SKY_KEYS[i + 1]; break; }
  }
  if (elevDeg < SKY_KEYS[0].e) b = a;
  const t = a === b ? 0 : smoothstep(0, 1, (elevDeg - a.e) / (b.e - a.e));
  const mix3 = (p, q) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t)];
  return {
    zen: mix3(a.zen, b.zen), hor: mix3(a.hor, b.hor), glow: mix3(a.glow, b.glow), sun: mix3(a.sun, b.sun),
    si: lerp(a.si, b.si, t), env: lerp(a.env, b.env, t), exp: lerp(a.exp, b.exp, t), fog: lerp(a.fog, b.fog, t),
  };
}

const SKY_GLSL = /* glsl */ `
uniform vec3 uGlow;
uniform vec3 uSunDisc;
uniform vec3 uMoonDir;
uniform sampler3D uCloud3D;
uniform float uCloudSteps;
uniform float uStars;
uniform float uFrame;

float hgPhase(float c, float g) { float g2 = g * g; return (1.0 - g2) / (4.0 * 3.14159 * pow(1.0 + g2 - 2.0 * g * c, 1.5)); }

vec3 skyBase(vec3 d) {
  float y = max(d.y, 0.0);
  vec3 sd = uTrueSun;
  vec2 dh = normalize(d.xz + 1e-5), sh = normalize(sd.xz + 1e-5);
  float az = max(dot(dh, sh), 0.0);
  float azs = dot(dh, sh) * 0.5 + 0.5;
  vec3 horC = mix(mix(uHorizon, uZenith * 1.35 + vec3(0.02), 0.42), uHorizon, pow(azs, 1.6));
  vec3 col = mix(horC, uZenith, pow(y, 0.5));
  float c = dot(d, sd);
  float sunUp = smoothstep(-0.25, 0.05, sd.y);
  col += uGlow * pow(az, 4.0) * exp(-y * 6.0) * 0.9 * sunUp;
  col += uGlow * hgPhase(c, 0.76) * 0.55 * sunUp;
  col += uGlow * pow(max(c, 0.0), 3.0) * 0.12 * sunUp;
  // horizon haze band
  col = mix(col, horC * 1.05, exp(-y * 30.0) * 0.4);
  if (d.y < 0.0) col = mix(horC, horC * 0.55 + uZenith * 0.1, smoothstep(0.0, -0.3, d.y));
  return col;
}

float cloudDensity(vec3 p, float detail) {
  float h = clamp((p.y - 1500.0) / 750.0, 0.0, 1.0);
  float cov = cloudCov(p.xz);
  if (cov < 0.01) return 0.0;
  float top = 0.3 + 0.7 * cov;
  float profile = smoothstep(0.0, 0.08, h) * (1.0 - smoothstep(top * 0.55, top, h));
  vec3 q = vec3((p.x + uCloudOff.x * 0.4) * 0.00024, p.y * 0.0007, (p.z + uCloudOff.y * 0.4) * 0.00024);
  float shape = textureLod(uCloud3D, q, 0.0).r;
  float d = cov * profile * 1.3 - 0.32 + (shape - 0.5) * 0.75;
  if (detail > 0.5 && d > 0.0) {
    float det = textureLod(uCloud3D, p * vec3(0.0019, 0.0026, 0.0019) + vec3(uTime * 0.004, 0.0, 0.0), 0.0).r;
    d -= (1.0 - det) * 0.22 * (1.0 - clamp(d * 2.5, 0.0, 1.0));
  }
  return clamp(d, 0.0, 1.0);
}

vec4 flatClouds(vec3 ro, vec3 rd, vec3 sunCol, float phase, vec3 amb, float t0) {
  vec3 p = ro + rd * t0;
  float d = cloudDensity(vec3(p.x, 1690.0, p.z), 0.0);
  float d2 = cloudDensity(vec3(p.x, 1880.0, p.z) + vec3(rd.x, 0.0, rd.z) * 300.0, 0.0);
  float a = smoothstep(0.0, 0.25, max(d, d2)) * 0.96;
  float thick = clamp(d + d2, 0.0, 1.0);
  vec3 col = amb * (0.55 + 0.45 * (1.0 - thick)) + sunCol * phase * (0.9 - thick * 0.45) * 0.8;
  return vec4(col * a, a);
}

vec4 renderClouds(vec3 ro, vec3 rd, vec3 sunCol, float jitter) {
  if (rd.y < 0.012) return vec4(0.0);
  float t0 = (1500.0 - ro.y) / rd.y;
  float farK = smoothstep(3500.0, 8000.0, t0);
  float t1 = (2250.0 - ro.y) / rd.y;
  if (t0 < 0.0) t0 = 0.0;
  t1 = min(t1, t0 + 5200.0);
  float steps = uCloudSteps;
  float dt = (t1 - t0) / steps;
  float T = 1.0;
  vec3 acc = vec3(0.0);
  vec3 L = uTrueSun.y > -0.05 ? uTrueSun : uMoonDir;
  float c = dot(rd, L);
  float phase = mix(hgPhase(c, 0.62), hgPhase(c, -0.18), 0.35) * 4.0 * 3.14159;
  vec3 amb = mix(uHorizon, uZenith, 0.5) * 1.3 + vec3(0.02);
  float t = t0 + dt * jitter;
  if (farK > 0.999) {
    vec4 fc = flatClouds(ro, rd, sunCol, phase, amb, t0);
    float fade = exp(-t0 * 0.00007);
    return vec4(fc.rgb * fade, fc.a * fade);
  }
  for (int i = 0; i < 40; i++) {
    if (float(i) >= steps) break;
    vec3 p = ro + rd * t;
    float dens = cloudDensity(p, 1.0);
    if (dens > 0.001) {
      float ld = 0.0;
      for (int k = 1; k <= 4; k++) ld += cloudDensity(p + L * float(k * k) * 40.0, 0.0);
      float beer = exp(-ld * 1.6) ;
      float powder = 1.0 - exp(-dens * 4.0) * 0.8;
      float h = clamp((p.y - 1500.0) / 750.0, 0.0, 1.0);
      vec3 lit = sunCol * beer * powder * phase * 1.7 + amb * (0.45 + 0.55 * h);
      float a = 1.0 - exp(-dens * dt * 0.012);
      acc += T * a * lit;
      T *= 1.0 - a;
      if (T < 0.02) break;
    }
    t += dt;
  }
  vec4 res = vec4(acc, 1.0 - T);
  if (farK > 0.001) res = mix(res, flatClouds(ro, rd, sunCol, phase, amb, t0), farK);
  float fade = exp(-t0 * 0.00007);
  return vec4(res.rgb * fade, res.a * fade);
}

vec3 starField(vec3 d) {
  vec3 p = d * 280.0;
  vec3 cell = floor(p);
  float h = hash12(cell.xy + cell.z * 17.13);
  vec3 f = fract(p) - 0.5;
  float star = 0.0;
  if (h > 0.985) {
    float tw = 0.6 + 0.4 * sin(uTime * (1.0 + h * 5.0) + h * 40.0);
    star = smoothstep(0.18, 0.0, length(f)) * tw * (h - 0.985) * 90.0;
  }
  // faint milky way band
  float band = exp(-pow(dot(d, normalize(vec3(0.3, 0.2, -0.93))) * 3.2, 2.0));
  float mw = texture2D(uNoise, d.xz * 1.7 + d.y).b * band;
  return vec3(0.8, 0.85, 1.0) * star + vec3(0.12, 0.13, 0.18) * mw * mw * 0.35;
}
`;

let skyMesh, sunLight, skyMat;
const skyState = { hour: 16.85, elev: 10, flow: false, flowRate: 1 / 60, cover: 0.42, envDirty: true, lastEnvElev: 999, lastEnvCover: -1 };

function buildSky() {
  skyMat = new THREE.ShaderMaterial({
    uniforms: {
      ...G,
      uGlow: { value: new THREE.Color() },
      uSunDisc: { value: new THREE.Color() },
      uMoonDir: { value: new THREE.Vector3() },
      uCloud3D: { value: TEX.cloud3d },
      uCloudSteps: { value: Qs.cloudSteps },
      uStars: { value: 0 },
      uFrame: { value: 0 },
      uEnvPass: { value: 0 },
    },
    vertexShader: /* glsl */ `
      varying vec3 vDir;
      void main() {
        vDir = position;
        vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        gl_Position = p.xyww;
      }
    `,
    fragmentShader: /* glsl */ `
      ${GLSL_COMMON}
      ${SKY_GLSL}
      uniform float uEnvPass;
      varying vec3 vDir;
      void main() {
        vec3 d = normalize(vDir);
        vec3 col = skyBase(d);
        float night = uStars;
        if (night > 0.001 && d.y > 0.0) col += starField(d) * night;
        // moon
        float cm = dot(d, uMoonDir);
        if (night > 0.001) {
          float md = smoothstep(0.99955, 0.99975, cm);
          float mare = texture2D(uNoise, (d.xz - uMoonDir.xz) * 60.0).g;
          col += vec3(1.0, 0.97, 0.9) * md * (0.9 + mare * 0.4) * 1.6 * night;
          col += vec3(0.25, 0.3, 0.45) * pow(max(cm, 0.0), 400.0) * 0.4 * night;
        }
        // sun disc (limb darkened), hidden by clouds below
        float cs = dot(d, uTrueSun);
        float disc = smoothstep(0.99962, 0.9998, cs);
        vec3 sunC = uSunDisc * disc * (1.0 - uEnvPass * 0.97);
        vec3 camPos = vec3(cameraPosition.x, max(cameraPosition.y, 2.0), cameraPosition.z);
        float j = hash12(gl_FragCoord.xy + fract(uFrame * 0.618) * 100.0);
        vec3 sunLightCol = uSunCol;
        if (uTrueSun.y < -0.05) sunLightCol = vec3(0.25, 0.3, 0.42) * 0.4;
        else sunLightCol = uSunCol * 1.25 + vec3(0.25, 0.1, 0.05) * uGlow;
        vec4 cl = renderClouds(camPos, d, sunLightCol, j);
        col = col * (1.0 - cl.a) + cl.rgb + sunC * (1.0 - cl.a);
        // horizon fog to match terrain fog
        float hz = exp(-max(d.y, 0.0) * 16.0);
        col = mix(col, fogColorDir(d), hz * 0.5);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
    side: THREE.BackSide,
    depthWrite: false,
    depthTest: true,
  });
  skyMesh = new THREE.Mesh(new THREE.SphereGeometry(10000, 48, 24), skyMat);
  skyMesh.frustumCulled = false;
  skyMesh.renderOrder = -10;
  scene.add(skyMesh);

  sunLight = new THREE.DirectionalLight(0xffffff, 3);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(Qs.shadow, Qs.shadow);
  sunLight.shadow.bias = -0.0004;
  sunLight.shadow.normalBias = 0.05;
  sunLight.shadow.camera.near = 1;
  sunLight.shadow.camera.far = 2400;
  scene.add(sunLight);
  scene.add(sunLight.target);
}

// environment map from the sky (clouds included)
let pmrem, envRT, envScene, envSky;
function initEnv() {
  pmrem = new THREE.PMREMGenerator(renderer);
  envScene = new THREE.Scene();
  envSky = new THREE.Mesh(skyMesh.geometry, skyMat);
  envSky.frustumCulled = false;
  envScene.add(envSky);
}
function updateEnv() {
  skyMat.uniforms.uEnvPass.value = 1;
  const steps = skyMat.uniforms.uCloudSteps.value;
  skyMat.uniforms.uCloudSteps.value = 10;
  const old = envRT;
  envRT = pmrem.fromScene(envScene, 0, 1, 20000);
  scene.environment = envRT.texture;
  if (old) old.dispose();
  skyMat.uniforms.uEnvPass.value = 0;
  skyMat.uniforms.uCloudSteps.value = steps;
}

const _v = new THREE.Vector3();
function sunDirection(hour) {
  const a = ((hour - 6) / 12) * Math.PI;
  const lat = THREE.MathUtils.degToRad(30);
  _v.set(Math.cos(a), Math.sin(a) * Math.cos(lat) - 0.1, Math.sin(a) * Math.sin(lat) + 0.3);
  return _v.normalize().clone();
}

function updateSky(dt) {
  if (skyState.flow) skyState.hour = (skyState.hour + dt * skyState.flowRate) % 24;
  const sd = sunDirection(skyState.hour);
  const elev = THREE.MathUtils.radToDeg(Math.asin(sd.y));
  skyState.elev = elev;
  const P = skyPalette(elev);
  const moon = sd.clone().multiplyScalar(-1);
  moon.y = Math.abs(moon.y) * 0.8 + 0.25; moon.normalize();
  const night = smoothstep(-2, -12, elev);
  G.uNight.value = smoothstep(1, -6, elev);
  G.uDay.value = smoothstep(-8, 20, elev);
  G.uTrueSun.value.copy(sd);
  G.uZenith.value.setRGB(...P.zen);
  G.uHorizon.value.setRGB(...P.hor);
  skyMat.uniforms.uGlow.value.setRGB(...P.glow);
  skyMat.uniforms.uMoonDir.value.copy(moon);
  skyMat.uniforms.uStars.value = night;
  skyMat.uniforms.uSunDisc.value.setRGB(P.sun[0] * 28, P.sun[1] * 26, P.sun[2] * 24).multiplyScalar(smoothstep(-1.5, 1, elev));

  // light = sun by day, moon by night (crossfade through twilight)
  const useMoon = elev < -4;
  const ldir = useMoon ? moon : sd;
  let li = P.si;
  if (!useMoon) li *= smoothstep(-4, 1.5, elev);
  else li *= smoothstep(-4, -10, elev);
  G.uSunDir.value.copy(ldir);
  G.uSunCol.value.setRGB(...P.sun).multiplyScalar(li);
  sunLight.color.setRGB(...P.sun);
  sunLight.intensity = li;

  // fog colours follow the horizon; sun side gets warm glow
  G.uFogCol.value.setRGB(P.hor[0] * 0.95, P.hor[1] * 0.97, P.hor[2]);
  G.uFogSunCol.value.setRGB(P.hor[0] + P.glow[0] * 0.3, P.hor[1] + P.glow[1] * 0.25, P.hor[2] + P.glow[2] * 0.15);
  G.uFogDensity.value = P.fog * (1 + skyState.cover * 0.6);
  G.uCloudCover.value = skyState.cover;
  scene.environmentIntensity = P.env;
  renderer.toneMappingExposure = P.exp * (postState.exposure || 1);

  skyMat.uniforms.uFrame.value++;
  if (Math.abs(elev - skyState.lastEnvElev) > 0.6 || Math.abs(skyState.cover - skyState.lastEnvCover) > 0.03) {
    skyState.lastEnvElev = elev;
    skyState.lastEnvCover = skyState.cover;
    skyState.envDirty = true;
  }
}

// ---- 05_water.js ----
// ============================================================================
// Water: Gerstner swell on the open sea, layered ripple normals, planar
// reflections, depth-based transparency, shoreline foam. Built on the PBR
// material so sun glints, lamp reflections and shadows come for free.
// ============================================================================

const WATER = {
  mesh: null, mat: null,
  reflRT: null, reflCam: new THREE.PerspectiveCamera(),
  texMat: new THREE.Matrix4(),
  uRefl: { value: null }, uReflMat: { value: new THREE.Matrix4() }, uReflOn: { value: 0 },
  uWaterN: { value: null }, uWaveAmp: { value: 1 },
};

function waterGrid(N, near, far) {
  const pos = [], idx = [];
  const f = (s) => Math.sign(s) * (Math.abs(s) * near + Math.pow(Math.abs(s), 4) * far);
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    pos.push(f((i / N) * 2 - 1), 0, f((j / N) * 2 - 1));
  }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const p = j * (N + 1) + i;
    idx.push(p, p + N + 1, p + 1, p + 1, p + N + 1, p + N + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(new Array(pos.length).fill(0).map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
  g.setIndex(idx);
  return g;
}

const WATER_VHEAD = /* glsl */ `
  uniform float uWaveAmp;
  varying float vSea;
  varying float vWaveH;
  vec3 gDisp;
  vec3 gNrm;
  void gerstner(vec2 p, float amp) {
    gDisp = vec3(0.0);
    gNrm = vec3(0.0, 1.0, 0.0);
    vec3 W[5] = vec3[5](vec3(0.15, -1.0, 34.0), vec3(-0.38, -0.92, 21.0), vec3(0.55, -0.83, 13.0), vec3(-0.75, -0.66, 8.0), vec3(0.2, -0.98, 5.1));
    float A[5] = float[5](0.30, 0.17, 0.085, 0.045, 0.022);
    for (int i = 0; i < 5; i++) {
      vec2 D = normalize(W[i].xy);
      float k = 6.2831853 / W[i].z;
      float w = sqrt(9.81 * k);
      float ph = k * dot(D, p) - w * uTime + float(i) * 1.7;
      float a = A[i] * amp;
      float Q = a > 0.0 ? min(0.75 / (k * a * 5.0), 1.0) : 0.0;
      float c = cos(ph), s = sin(ph);
      gDisp.x += Q * a * D.x * c;
      gDisp.z += Q * a * D.y * c;
      gDisp.y += a * s;
      gNrm.x -= D.x * k * a * c;
      gNrm.z -= D.y * k * a * c;
      gNrm.y -= Q * k * a * s;
    }
  }
`;

function makeWaterMaterial({ fixedDepth = -1, key = 'water' } = {}) {
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05, metalness: 0, transparent: true, depthWrite: true });
  mat.blending = THREE.CustomBlending;
  mat.blendSrc = THREE.OneFactor;
  mat.blendDst = THREE.OneMinusSrcAlphaFactor;
  mat.blendSrcAlpha = THREE.OneFactor;
  mat.blendDstAlpha = THREE.OneMinusSrcAlphaFactor;
  const fd = fixedDepth.toFixed(2);
  patch(mat, {
    key,
    uniforms: { uRefl: WATER.uRefl, uReflMat: WATER.uReflMat, uReflOn: WATER.uReflOn, uWaterN: WATER.uWaterN, uWaveAmp: WATER.uWaveAmp },
    vHead: WATER_VHEAD,
    vNormal: /* glsl */ `
      vec3 wp0 = (modelMatrix * vec4(position, 1.0)).xyz;
      float dep0 = ${fd} >= 0.0 ? ${fd} : max(-terrainH(wp0.xz), 0.0);
      vSea = ${fd} >= 0.0 ? 0.0 : smoothstep(118.0, 200.0, wp0.z) * smoothstep(0.5, 6.0, dep0);
      gerstner(wp0.xz, vSea * uWaveAmp * (0.55 + uWind.z * 0.9));
      objectNormal = normalize(gNrm);
      vWaveH = gDisp.y;
    `,
    vBegin: 'transformed += gDisp;',
    fHead: /* glsl */ `
      uniform sampler2D uRefl;
      uniform mat4 uReflMat;
      uniform float uReflOn;
      uniform sampler2D uWaterN;
      varying float vSea;
      varying float vWaveH;
      float wA, wFr, wFoam, wRough;
      vec3 wN;
    `,
    fColor: /* glsl */ `
      vec3 V = normalize(cameraPosition - vWPos);
      float dist = length(cameraPosition - vWPos);
      float ground = ${fd} >= 0.0 ? vWPos.y - ${fd} : terrainH(vWPos.xz);
      float depth = max(vWPos.y - ground, 0.0);
      vec2 wd = uWind.xy;
      float ws = uWind.z;
      vec2 p = vWPos.xz;
      vec3 n1 = texture2D(uWaterN, p * 0.041 + wd * uTime * 0.021).xyz * 2.0 - 1.0;
      vec3 n2 = texture2D(uWaterN, p * 0.093 + vec2(-wd.y, wd.x) * uTime * 0.017 + wd * uTime * 0.03).xyz * 2.0 - 1.0;
      vec3 n3 = texture2D(uWaterN, p * 0.29 - wd * uTime * 0.05).xyz * 2.0 - 1.0;
      float fadeD = 1.0 - smoothstep(30.0, 600.0, dist) * 0.75;
      float k = (0.22 + 0.55 * ws) * fadeD;
      vec2 dn = (n1.xy * 0.55 + n2.xy * 0.45 + n3.xy * 0.35 * (1.0 - smoothstep(10.0, 80.0, dist))) * k;
      vec3 gN = normalize(vNormal);
      // vNormal is view space; rebuild world geometric normal from it
      vec3 gW = normalize((vec4(gN, 0.0) * viewMatrix).xyz);
      wN = normalize(gW + vec3(dn.x, 0.0, dn.y));
      float NdV = clamp(dot(wN, V), 0.0, 1.0);
      wFr = 0.02 + 0.98 * pow(1.0 - NdV, 5.0);
      // transparency through the water column
      float thick = depth / max(V.y, 0.08);
      wA = 1.0 - exp(-thick * 0.32);
      wA = max(wA, smoothstep(0.0, 1.2, depth) * 0.25);
      // colours
      vec3 deep = vec3(0.006, 0.045, 0.055);
      vec3 shallow = vec3(0.05, 0.22, 0.2);
      vec3 body = mix(shallow, deep, smoothstep(0.3, 7.0, depth));
      // shoreline + crest foam
      float fn = texture2D(uNoise, p * 0.23 + vec2(uTime * 0.012, -uTime * 0.008)).a;
      float fn2 = texture2D(uNoise, p * 0.9 - vec2(uTime * 0.03, 0.0)).b;
      float lap = sin(uTime * 0.9 - depth * 5.5 + fn * 6.0) * 0.5 + 0.5;
      float shore = (1.0 - smoothstep(0.0, 0.75, depth)) * (${fd} >= 0.0 ? 0.0 : 1.0);
      wFoam = shore * smoothstep(0.35, 0.75, fn2 * 0.6 + lap * 0.5 + (0.75 - depth) * 0.45);
      wFoam += vSea * smoothstep(0.2, 0.42, vWaveH) * smoothstep(0.45, 0.75, fn2) * 0.8;
      wFoam = clamp(wFoam, 0.0, 1.0) * smoothstep(-0.05, 0.08, depth + 0.1);
      body = mix(body, vec3(0.8, 0.84, 0.86), wFoam);
      wA = mix(wA, 1.0, wFoam);
      diffuseColor.rgb = body;
      wRough = mix(0.035, 0.16, smoothstep(40.0, 900.0, dist));
      wRough = mix(wRough, 0.7, wFoam);
    `,
    fRough: 'roughnessFactor = wRough;',
    fNormal: 'normal = normalize((viewMatrix * vec4(wN, 0.0)).xyz);',
    fMaps: /* glsl */ `
      #if defined( RE_IndirectSpecular )
      if (uReflOn > 0.5) {
        vec4 rc = uReflMat * vec4(vWPos.x, 0.0, vWPos.z, 1.0);
        vec2 ruv = rc.xy / rc.w + (wN.xz) * 0.035 * (1.0 - wFoam);
        vec3 rcol = texture2D(uRefl, ruv).rgb;
        float edge = smoothstep(0.0, 0.03, ruv.x) * smoothstep(1.0, 0.97, ruv.x) * smoothstep(0.0, 0.03, ruv.y) * smoothstep(1.0, 0.97, ruv.y);
        radiance = mix(radiance, rcol, edge * (1.0 - wFoam));
      }
      #endif
    `,
    fDir: /* glsl */ `
      // sub-surface glow of backlit swell
      reflectedLight.directDiffuse += directLight.color * vec3(0.05, 0.25, 0.2) * vSea * max(vWaveH + 0.15, 0.0)
        * pow(clamp(dot(normalize(cameraPosition - vWPos), -uSunDir), 0.0, 1.0), 3.0) * 1.2;
    `,
    fOut: /* glsl */ `
      outgoingLight = totalSpecular + totalDiffuse * wA + totalEmissiveRadiance;
      diffuseColor.a = clamp(wA + wFr * (1.0 - wA), 0.0, 1.0);
    `,
    fog: /* glsl */ `
      { float ff = fogAmount(vWPos); gl_FragColor.rgb = gl_FragColor.rgb * (1.0 - ff) + fogColorFor(vWPos) * ff * gl_FragColor.a; }
    `,
  });
  return mat;
}

function buildWater() {
  WATER.uWaterN.value = TEX.water;
  WATER.mat = makeWaterMaterial();
  WATER.mesh = new THREE.Mesh(waterGrid(220, 70, 12500), WATER.mat);
  WATER.mesh.frustumCulled = false;
  WATER.mesh.renderOrder = 1;
  WATER.mesh.receiveShadow = true;
  scene.add(WATER.mesh);
  resizeReflection();
}

function resizeReflection() {
  if (WATER.reflRT) { WATER.reflRT.dispose(); WATER.reflRT = null; }
  if (!Qs.refl) { WATER.uReflOn.value = 0; return; }
  const w = Math.max(64, Math.floor(renderer.domElement.width * Qs.refl));
  const h = Math.max(64, Math.floor(renderer.domElement.height * Qs.refl));
  WATER.reflRT = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType });
  WATER.uRefl.value = WATER.reflRT.texture;
  WATER.uReflOn.value = 1;
}

const _rq = new THREE.Vector4(), _plane = new THREE.Plane(), _cp = new THREE.Vector4();
function renderReflection() {
  const cam = camera;
  // follow camera (snapped) so the fine inner rings stay under the viewer
  WATER.mesh.position.set(Math.round(cam.position.x), 0, Math.round(cam.position.z));
  if (!WATER.reflRT || cam.position.y < 0.05) return;
  const rc = WATER.reflCam;
  rc.copy(cam, false);
  rc.position.set(cam.position.x, -cam.position.y, cam.position.z);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
  dir.y = -dir.y;
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);
  up.y = -up.y;
  rc.up.copy(up);
  rc.lookAt(rc.position.clone().add(dir));
  rc.updateMatrixWorld();
  rc.projectionMatrix.copy(cam.projectionMatrix);
  // texture matrix (before oblique clip; clip only alters depth)
  WATER.uReflMat.value.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1)
    .multiply(rc.projectionMatrix).multiply(rc.matrixWorldInverse);
  // oblique near plane = water plane
  _plane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -0.05, 0));
  _plane.applyMatrix4(rc.matrixWorldInverse);
  _cp.set(_plane.normal.x, _plane.normal.y, _plane.normal.z, _plane.constant);
  const pm = rc.projectionMatrix.elements;
  _rq.x = (Math.sign(_cp.x) + pm[8]) / pm[0];
  _rq.y = (Math.sign(_cp.y) + pm[9]) / pm[5];
  _rq.z = -1.0;
  _rq.w = (1.0 + pm[10]) / pm[14];
  _cp.multiplyScalar(2.0 / _cp.dot(_rq));
  pm[2] = _cp.x; pm[6] = _cp.y; pm[10] = _cp.z + 1.0; pm[14] = _cp.w;
  rc.projectionMatrixInverse.copy(rc.projectionMatrix).invert();
  rc.layers.set(0);

  WATER.mesh.visible = false;
  const prevRT = renderer.getRenderTarget();
  renderer.setRenderTarget(WATER.reflRT);
  renderer.clear();
  renderer.render(scene, rc);
  renderer.setRenderTarget(prevRT);
  WATER.mesh.visible = true;
}

// ---- 06_post.js ----
// ============================================================================
// Post-processing: HDR scene (MSAA + depth) -> screen-space sun shafts ->
// bloom -> ACES tone map -> colour grade (vignette, grain, mild CA)
// ============================================================================

const postState = { rays: true, bloom: true, grade: true, exposure: 1 };
let composer, renderPass, raysPass, bloomPass, outputPass, gradePass;

const FS_VERT = /* glsl */ `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

class SunShaftsPass extends Pass {
  constructor() {
    super();
    this.needsSwap = true;
    this.rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType });
    this.samples = Qs.rays;
    this.maskMat = new THREE.ShaderMaterial({
      defines: { SAMPLES: this.samples },
      uniforms: {
        tColor: { value: null }, tDepth: { value: null },
        uSun: { value: new THREE.Vector2(0.5, 0.5) }, uAspect: { value: 1 }, uDensity: { value: 0.9 },
        uDecay: { value: 0.972 }, uWeight: { value: 1.0 }, uThresh: { value: 1.2 },
      },
      vertexShader: FS_VERT,
      fragmentShader: /* glsl */ `
        uniform sampler2D tColor;
        uniform sampler2D tDepth;
        uniform vec2 uSun;
        uniform float uAspect, uDensity, uDecay, uWeight, uThresh;
        varying vec2 vUv;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
        float occ(vec2 uv) {
          if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) return 0.0;
          float d = texture2D(tDepth, uv).r;
          if (d < 0.999999) return 0.0;
          vec3 c = texture2D(tColor, uv).rgb;
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
          vec2 dd = uv - uSun; dd.x *= uAspect;
          return min(max(l - uThresh, 0.0), 2.5) * exp(-dot(dd, dd) * 7.0);
        }
        void main() {
          vec2 delta = (vUv - uSun) * uDensity / float(SAMPLES);
          vec2 uv = vUv - delta * hash(gl_FragCoord.xy);
          float illum = 1.0, sum = 0.0;
          for (int i = 0; i < SAMPLES; i++) {
            uv -= delta;
            sum += occ(uv) * illum;
            illum *= uDecay;
          }
          gl_FragColor = vec4(vec3(sum * uWeight / float(SAMPLES)), 1.0);
        }
      `,
      depthTest: false, depthWrite: false,
    });
    this.compMat = new THREE.ShaderMaterial({
      uniforms: { tColor: { value: null }, tRays: { value: null }, uCol: { value: new THREE.Color() }, uStrength: { value: 0 } },
      vertexShader: FS_VERT,
      fragmentShader: /* glsl */ `
        uniform sampler2D tColor;
        uniform sampler2D tRays;
        uniform vec3 uCol;
        uniform float uStrength;
        varying vec2 vUv;
        void main() {
          vec3 c = texture2D(tColor, vUv).rgb;
          vec3 r = texture2D(tRays, vUv).rgb;
          gl_FragColor = vec4(c + r * uCol * uStrength, 1.0);
        }
      `,
      depthTest: false, depthWrite: false,
    });
    this.q1 = new FullScreenQuad(this.maskMat);
    this.q2 = new FullScreenQuad(this.compMat);
  }
  setSize(w, h) { this.rt.setSize(Math.max(2, w >> 1), Math.max(2, h >> 1)); this.maskMat.uniforms.uAspect.value = w / h; }
  render(r, writeBuffer, readBuffer) {
    const s = this.compMat.uniforms.uStrength.value;
    this.compMat.uniforms.tColor.value = readBuffer.texture;
    if (s > 0.001) {
      this.maskMat.uniforms.tColor.value = readBuffer.texture;
      this.maskMat.uniforms.tDepth.value = readBuffer.depthTexture;
      r.setRenderTarget(this.rt);
      this.q1.render(r);
      this.compMat.uniforms.tRays.value = this.rt.texture;
    } else {
      this.compMat.uniforms.tRays.value = this.rt.texture;
    }
    r.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    this.q2.render(r);
  }
}

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) },
    uVig: { value: 0.34 }, uSat: { value: 1.14 }, uCon: { value: 1.1 }, uGrain: { value: 0.025 }, uCA: { value: 0.0025 },
    uWarm: { value: new THREE.Vector3(1.02, 1.0, 0.97) }, uShadowTint: { value: new THREE.Vector3(0.98, 1.0, 1.04) },
  },
  vertexShader: /* glsl */ `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */ `
    uniform sampler2D tDiffuse;
    uniform float uTime, uVig, uSat, uCon, uGrain, uCA;
    uniform vec2 uRes;
    uniform vec3 uWarm, uShadowTint;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec2 c = vUv - 0.5;
      float r2 = dot(c, c);
      vec2 off = c * uCA * r2 * 4.0;
      vec3 col = vec3(texture2D(tDiffuse, vUv - off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv + off).b);
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, uSat);
      col = (col - 0.5) * uCon + 0.5;
      col *= mix(uShadowTint, uWarm, smoothstep(0.1, 0.8, l));
      col *= 1.0 - uVig * smoothstep(0.08, 0.62, r2 * 1.5);
      col += (hash(vUv * uRes + fract(uTime) * 91.7) - 0.5) * uGrain;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
  `,
};

function buildPost() {
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const rt = new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType, samples: Qs.msaa });
  rt.depthTexture = new THREE.DepthTexture(size.x, size.y);
  rt.depthTexture.type = THREE.UnsignedIntType;
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(1);
  renderPass = new RenderPass(scene, camera);
  raysPass = new SunShaftsPass();
  bloomPass = new UnrealBloomPass(new THREE.Vector2(size.x, size.y), 0.22, 0.45, 2.2);
  outputPass = new OutputPass();
  gradePass = new ShaderPass(GradeShader);
  composer.addPass(renderPass);
  composer.addPass(raysPass);
  composer.addPass(bloomPass);
  composer.addPass(outputPass);
  composer.addPass(gradePass);
  composer.setSize(size.x, size.y);
}

const _sunNdc = new THREE.Vector3(), _camDir = new THREE.Vector3();
function updatePost(t) {
  const sun = G.uTrueSun.value;
  _sunNdc.copy(sun).multiplyScalar(8000).add(camera.position).project(camera);
  camera.getWorldDirection(_camDir);
  const facing = smoothstep(0.0, 0.35, _camDir.dot(sun));
  const on = _sunNdc.z < 1 ? 1 : 0;
  const sx = _sunNdc.x * 0.5 + 0.5, sy = _sunNdc.y * 0.5 + 0.5;
  const edge = smoothstep(-0.4, 0.05, Math.min(sx, sy, 1 - sx, 1 - sy));
  const elevFade = smoothstep(-2, 4, skyState.elev) * (1 - smoothstep(35, 70, skyState.elev) * 0.6);
  raysPass.maskMat.uniforms.uSun.value.set(sx, sy);
  raysPass.compMat.uniforms.uStrength.value = postState.rays ? 0.3 * facing * on * edge * elevFade : 0;
  raysPass.compMat.uniforms.uCol.value.copy(G.uSunCol.value).multiplyScalar(0.25);
  raysPass.enabled = postState.rays;
  bloomPass.enabled = postState.bloom;
  gradePass.enabled = postState.grade;
  gradePass.uniforms.uTime.value = t;
  gradePass.uniforms.uRes.value.set(renderer.domElement.width, renderer.domElement.height);
  // night: cooler shadows
  const n = G.uNight.value;
  gradePass.uniforms.uShadowTint.value.set(lerp(0.98, 0.93, n), 1.0, lerp(1.04, 1.12, n));
  gradePass.uniforms.uWarm.value.set(lerp(1.03, 1.05, n), 1.0, lerp(0.96, 0.9, n));
}

// ---- 07_controls.js ----
// ============================================================================
// Camera modes: orbit (look around), walk (first person on the ground),
// fly (free camera), cine (slow drone path). Plus smooth viewpoint jumps.
// ============================================================================

const VIEWS = [
  { key: '1', name: '항구', pos: [230, 14, 190], tgt: [60, 6, 150] },
  { key: '2', name: '운하', pos: [0, 5.3, 63], tgt: [0, 2.2, -40] },
  { key: '3', name: '광장', pos: [18, 4.0, 0], tgt: [38, 6, -30] },
  { key: '4', name: '공원', pos: [163, 4.4, -122], tgt: [180, 1.0, -162] },
  { key: '5', name: '언덕', pos: [-70, 96, -430], tgt: [10, 0, 60] },
  { key: '6', name: '등대', pos: [470, 62, 300], tgt: [110, 6, 110] },
  { key: '7', name: '해변', pos: [-352, 3.6, 116], tgt: [-470, 1.2, 176] },
];

// Ground/collision query; replaced by the city module once it exists.
let walkInfo = (x, z) => ({ h: heightAt(x, z), blocked: heightAt(x, z) < 0.25 });

const CTRL = {
  mode: 'orbit',
  orbit: null,
  yaw: 0, pitch: 0,
  vel: new THREE.Vector3(),
  keys: new Set(),
  locked: false,
  vy: 0, grounded: true, bob: 0,
  trans: null, // {from, to, fromT, toT, t, dur}
  cineT: 0, cine: null,
  touchLook: null, joy: null, joyVec: new THREE.Vector2(),
  eye: 1.65,
};

function initControls() {
  const oc = new OrbitControls(camera, canvas);
  oc.enableDamping = true;
  oc.dampingFactor = 0.07;
  oc.rotateSpeed = 0.55;
  oc.zoomSpeed = 0.9;
  oc.panSpeed = 0.8;
  oc.minDistance = 4;
  oc.maxDistance = 1800;
  oc.maxPolarAngle = Math.PI * 0.495;
  oc.screenSpacePanning = false;
  CTRL.orbit = oc;
  const v = VIEWS[0];
  camera.position.set(...v.pos);
  oc.target.set(...v.tgt);
  oc.update();

  addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    CTRL.keys.add(e.code);
    if (e.code === 'Space' && CTRL.mode === 'walk' && CTRL.grounded) { CTRL.vy = 4.2; CTRL.grounded = false; }
    if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code) && CTRL.mode !== 'orbit') e.preventDefault();
  });
  addEventListener('keyup', (e) => CTRL.keys.delete(e.code));
  addEventListener('blur', () => CTRL.keys.clear());

  canvas.addEventListener('click', () => {
    if ((CTRL.mode === 'walk' || CTRL.mode === 'fly') && !IS_TOUCH && !CTRL.locked) {
      try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (_) { /* optional */ }
    }
  });
  document.addEventListener('pointerlockchange', () => {
    CTRL.locked = document.pointerLockElement === canvas;
    $('crosshair').classList.toggle('show', CTRL.locked);
  });
  // mouse look (pointer lock) or drag-look fallback
  let dragging = false, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', (e) => {
    if (CTRL.mode !== 'walk' && CTRL.mode !== 'fly') return;
    if (e.pointerType === 'touch') return;
    dragging = true; lx = e.clientX; ly = e.clientY;
  });
  addEventListener('pointerup', () => { dragging = false; });
  addEventListener('pointermove', (e) => {
    if (CTRL.mode !== 'walk' && CTRL.mode !== 'fly') return;
    if (e.pointerType === 'touch') return;
    let dx = 0, dy = 0;
    if (CTRL.locked) { dx = e.movementX; dy = e.movementY; }
    else if (dragging) { dx = e.clientX - lx; dy = e.clientY - ly; lx = e.clientX; ly = e.clientY; }
    else return;
    CTRL.yaw -= dx * 0.0022;
    CTRL.pitch = clamp(CTRL.pitch - dy * 0.0022, -1.45, 1.45);
  });

  // touch: left third = joystick, rest = look
  canvas.addEventListener('touchstart', (e) => {
    if (CTRL.mode !== 'walk' && CTRL.mode !== 'fly') return;
    for (const t of e.changedTouches) {
      if (t.clientX < innerWidth * 0.4 && t.clientY > innerHeight * 0.35 && !CTRL.joy) {
        CTRL.joy = { id: t.identifier, x: t.clientX, y: t.clientY };
        const j = $('joy'); j.classList.add('show');
        j.style.left = (t.clientX - 55) + 'px'; j.style.top = (t.clientY - 55) + 'px'; j.style.bottom = 'auto';
      } else if (!CTRL.touchLook) CTRL.touchLook = { id: t.identifier, x: t.clientX, y: t.clientY };
    }
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    if (CTRL.mode !== 'walk' && CTRL.mode !== 'fly') return;
    for (const t of e.changedTouches) {
      if (CTRL.joy && t.identifier === CTRL.joy.id) {
        const dx = clamp((t.clientX - CTRL.joy.x) / 45, -1, 1), dy = clamp((t.clientY - CTRL.joy.y) / 45, -1, 1);
        CTRL.joyVec.set(dx, dy);
        $('joy').firstElementChild.style.transform = `translate(${dx * 33}px, ${dy * 33}px)`;
      } else if (CTRL.touchLook && t.identifier === CTRL.touchLook.id) {
        CTRL.yaw -= (t.clientX - CTRL.touchLook.x) * 0.005;
        CTRL.pitch = clamp(CTRL.pitch - (t.clientY - CTRL.touchLook.y) * 0.005, -1.45, 1.45);
        CTRL.touchLook.x = t.clientX; CTRL.touchLook.y = t.clientY;
      }
    }
    e.preventDefault();
  }, { passive: false });
  const tend = (e) => {
    for (const t of e.changedTouches) {
      if (CTRL.joy && t.identifier === CTRL.joy.id) {
        CTRL.joy = null; CTRL.joyVec.set(0, 0);
        $('joy').classList.remove('show'); $('joy').firstElementChild.style.transform = '';
      }
      if (CTRL.touchLook && t.identifier === CTRL.touchLook.id) CTRL.touchLook = null;
    }
  };
  canvas.addEventListener('touchend', tend);
  canvas.addEventListener('touchcancel', tend);

  buildCinePath();
}

function syncYawPitchFromCamera() {
  const d = new THREE.Vector3();
  camera.getWorldDirection(d);
  CTRL.yaw = Math.atan2(-d.x, -d.z);
  CTRL.pitch = Math.asin(clamp(d.y, -1, 1));
}

function setMode(mode) {
  const prev = CTRL.mode;
  if (prev === mode) return;
  CTRL.mode = mode;
  CTRL.trans = null;
  if (document.pointerLockElement) { try { document.exitPointerLock(); } catch (_) { /* ignore */ } }
  CTRL.orbit.enabled = mode === 'orbit';
  if (mode === 'orbit') {
    const d = new THREE.Vector3();
    camera.getWorldDirection(d);
    const dist = clamp(camera.position.y * 1.5, 25, 250);
    CTRL.orbit.target.copy(camera.position).addScaledVector(d, dist);
    CTRL.orbit.target.y = Math.max(walkInfo(CTRL.orbit.target.x, CTRL.orbit.target.z).h, 0);
    CTRL.orbit.update();
  } else {
    syncYawPitchFromCamera();
  }
  if (mode === 'walk') {
    const p = camera.position;
    let w = walkInfo(p.x, p.z);
    if (w.blocked) {
      // find a nearby walkable spot
      let best = null;
      for (let r = 2; r < 200 && !best; r += 3) for (let a = 0; a < 16; a++) {
        const x = p.x + Math.cos(a / 16 * TAU) * r, z = p.z + Math.sin(a / 16 * TAU) * r;
        const wi = walkInfo(x, z);
        if (!wi.blocked) { best = [x, z]; break; }
      }
      if (best) { p.x = best[0]; p.z = best[1]; w = walkInfo(p.x, p.z); }
    }
    p.y = w.h + CTRL.eye;
    CTRL.pitch = clamp(CTRL.pitch, -0.4, 0.3);
    CTRL.vy = 0; CTRL.grounded = true;
    showHint(IS_TOUCH ? '왼쪽 아래를 끌어 걷고, 화면을 밀어 둘러보세요' : '화면을 클릭하면 시점이 고정돼요<br><kbd>W A S D</kbd> 걷기 · <kbd>Shift</kbd> 달리기 · <kbd>Space</kbd> 점프 · <kbd>Esc</kbd> 해제');
  }
  if (mode === 'fly') showHint(IS_TOUCH ? '왼쪽 아래를 끌어 날고, 화면을 밀어 방향을 바꿔요' : '화면을 클릭하면 시점이 고정돼요<br><kbd>W A S D</kbd> 이동 · <kbd>E</kbd>/<kbd>Q</kbd> 오르내리기 · <kbd>Shift</kbd> 빠르게');
  if (mode === 'cine') { CTRL.cineT = nearestCineT(); showHint('천천히 도시를 한 바퀴 돌아요'); }
  document.querySelectorAll('#modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
}

let hintTimer = 0;
function showHint(html) {
  const h = $('hint');
  h.innerHTML = html;
  h.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => h.classList.remove('show'), 3800);
}

function goToView(i) {
  const v = VIEWS[i];
  if (!v) return;
  if (CTRL.mode === 'cine') setMode('orbit');
  const from = camera.position.clone();
  const fromT = new THREE.Vector3();
  camera.getWorldDirection(fromT); fromT.multiplyScalar(40).add(from);
  if (CTRL.mode === 'orbit') fromT.copy(CTRL.orbit.target);
  const to = new THREE.Vector3(...v.pos), toT = new THREE.Vector3(...v.tgt);
  if (CTRL.mode === 'walk') { const w = walkInfo(to.x, to.z); to.y = w.h + CTRL.eye; }
  const dist = from.distanceTo(to);
  CTRL.trans = { from, to, fromT, toT, t: 0, dur: clamp(1.4 + dist / 400, 1.6, 4.5), lift: clamp(dist * 0.18, 0, 140) };
}

// --- cinematic path -----------------------------------------------------------
function buildCinePath() {
  const P = [
    [-120, 60, 330], [40, 26, 250], [8, 7, 150], [0, 5.5, 60], [0, 6, -60], [30, 16, -120],
    [150, 12, -120], [200, 30, -200], [120, 80, -330], [-80, 110, -300], [-230, 60, -120],
    [-320, 14, 120], [-260, 10, 220],
  ];
  const T = [
    [60, 10, 120], [10, 6, 100], [0, 4, 40], [0, 3.5, -30], [30, 6, -20], [150, 4, -150],
    [180, 2, -165], [120, 10, -120], [0, 0, 40], [30, 0, 80], [-60, 5, 100],
    [-200, 3, 300], [-40, 10, 140],
  ];
  CTRL.cine = {
    pos: new THREE.CatmullRomCurve3(P.map((p) => new THREE.Vector3(...p)), true, 'centripetal'),
    tgt: new THREE.CatmullRomCurve3(T.map((p) => new THREE.Vector3(...p)), true, 'centripetal'),
  };
}
function nearestCineT() {
  let best = 0, bd = Infinity;
  for (let i = 0; i < 200; i++) {
    const d = CTRL.cine.pos.getPointAt(i / 200).distanceToSquared(camera.position);
    if (d < bd) { bd = d; best = i / 200; }
  }
  return best;
}

const _f = new THREE.Vector3(), _r = new THREE.Vector3(), _m = new THREE.Vector3();
function updateControls(dt) {
  const K = CTRL.keys;
  if (CTRL.trans) {
    const tr = CTRL.trans;
    tr.t = Math.min(1, tr.t + dt / tr.dur);
    const e = tr.t < 0.5 ? 4 * tr.t ** 3 : 1 - Math.pow(-2 * tr.t + 2, 3) / 2;
    camera.position.lerpVectors(tr.from, tr.to, e);
    camera.position.y += Math.sin(Math.PI * e) * tr.lift;
    const tg = new THREE.Vector3().lerpVectors(tr.fromT, tr.toT, e);
    camera.lookAt(tg);
    if (tr.t >= 1) {
      CTRL.trans = null;
      if (CTRL.mode === 'orbit') { CTRL.orbit.target.copy(tr.toT); CTRL.orbit.update(); }
      else syncYawPitchFromCamera();
    }
    return;
  }
  if (CTRL.mode === 'orbit') {
    CTRL.orbit.update();
    const g = walkInfo(camera.position.x, camera.position.z).h;
    const minY = Math.max(g, 0) + 1.5;
    if (camera.position.y < minY) camera.position.y = minY;
    return;
  }
  if (CTRL.mode === 'cine') {
    CTRL.cineT = (CTRL.cineT + dt / 150) % 1;
    const p = CTRL.cine.pos.getPointAt(CTRL.cineT);
    const t = CTRL.cine.tgt.getPointAt(CTRL.cineT);
    const g = walkInfo(p.x, p.z).h;
    p.y = Math.max(p.y, Math.max(g, 0) + 3);
    camera.position.lerp(p, 1 - Math.exp(-dt * 2));
    _m.copy(t);
    const look = new THREE.Vector3();
    camera.getWorldDirection(look);
    const cur = camera.position.clone().add(look.multiplyScalar(60));
    cur.lerp(_m, 1 - Math.exp(-dt * 1.5));
    camera.lookAt(cur);
    return;
  }
  // walk / fly share look
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(CTRL.pitch, CTRL.yaw, 0, 'YXZ'));
  camera.quaternion.slerp(q, 1 - Math.exp(-dt * 30));
  let fx = 0, fz = 0, fy = 0;
  if (K.has('KeyW') || K.has('ArrowUp')) fz += 1;
  if (K.has('KeyS') || K.has('ArrowDown')) fz -= 1;
  if (K.has('KeyA') || K.has('ArrowLeft')) fx -= 1;
  if (K.has('KeyD') || K.has('ArrowRight')) fx += 1;
  if (K.has('KeyE')) fy += 1;
  if (K.has('KeyQ') || K.has('KeyC')) fy -= 1;
  fx += CTRL.joyVec.x; fz -= CTRL.joyVec.y;
  const fast = K.has('ShiftLeft') || K.has('ShiftRight');

  if (CTRL.mode === 'fly') {
    if (K.has('Space')) fy += 1;
    camera.getWorldDirection(_f);
    _r.crossVectors(_f, camera.up).normalize();
    const speed = fast ? 60 : 16;
    _m.set(0, 0, 0).addScaledVector(_f, fz).addScaledVector(_r, fx);
    _m.y += fy;
    if (_m.lengthSq() > 1) _m.normalize();
    CTRL.vel.lerp(_m.multiplyScalar(speed), 1 - Math.exp(-dt * 4));
    camera.position.addScaledVector(CTRL.vel, dt);
    const g = walkInfo(camera.position.x, camera.position.z).h;
    camera.position.y = clamp(camera.position.y, Math.max(g, 0) + 1.2, 1400);
    return;
  }

  // walk
  _f.set(-Math.sin(CTRL.yaw), 0, -Math.cos(CTRL.yaw));
  _r.set(-_f.z, 0, _f.x);
  _m.set(0, 0, 0).addScaledVector(_f, fz).addScaledVector(_r, fx);
  if (_m.lengthSq() > 1) _m.normalize();
  const speed = fast ? 5.2 : 1.9;
  CTRL.vel.lerp(_m.multiplyScalar(speed), 1 - Math.exp(-dt * 8));
  const p = camera.position;
  const nx = p.x + CTRL.vel.x * dt, nz = p.z + CTRL.vel.z * dt;
  const cur = walkInfo(p.x, p.z);
  const feet = p.y - CTRL.eye;
  const ok = (x, z) => { const w = walkInfo(x, z); return !w.blocked && w.h - feet < 0.55; };
  if (ok(nx, nz)) { p.x = nx; p.z = nz; }
  else if (ok(nx, p.z)) p.x = nx;
  else if (ok(p.x, nz)) p.z = nz;
  const g = walkInfo(p.x, p.z).h;
  CTRL.vy -= 9.8 * dt;
  let y = feet + CTRL.vy * dt;
  if (y <= g) { y = y < g - 0.3 ? lerp(y, g, 1 - Math.exp(-dt * 18)) : g; CTRL.vy = 0; CTRL.grounded = true; }
  else if (y - g > 0.05) CTRL.grounded = false;
  if (CTRL.grounded && y < g + 0.02) y = lerp(feet, g, 1 - Math.exp(-dt * 14));
  const mv = Math.hypot(CTRL.vel.x, CTRL.vel.z);
  CTRL.bob += mv * dt * 2.1;
  const bob = CTRL.grounded ? Math.sin(CTRL.bob * Math.PI) * 0.035 * clamp(mv / 2, 0, 1.4) : 0;
  p.y = y + CTRL.eye + bob;
  void cur;
  G.uPlayer.value.set(p.x, y, p.z);
}

// ---- 08_citymats.js ----
// ============================================================================
// City materials: procedural facades (recessed windows with interior
// mapping, shutters, plinths, quoins), roof tiles, ashlar stone, paving,
// generic props (vertex colour + roughness/metal/emissive), railings, wood.
// ============================================================================

// tangent frame from a world normal (u along a horizontal, v "up" the face)
const GLSL_FRAME = /* glsl */ `
  void faceFrame(vec3 N, out vec3 T, out vec3 B) {
    vec3 up = vec3(0.0, 1.0, 0.0);
    vec3 c = cross(up, N);
    T = dot(c, c) < 1e-4 ? vec3(1.0, 0.0, 0.0) : normalize(c);
    B = cross(N, T);
  }
`;

const FACADE_FRAG = /* glsl */ `
  varying vec2 vUvM;
  varying vec4 vF;
  varying vec4 vS;
  varying vec3 vNW;
  vec3 fAlb; float fRough; vec3 fNT; vec3 fEmis;
  ${GLSL_FRAME}
  float sdBox(vec2 p, vec2 b) { vec2 d = abs(p) - b; return max(d.x, d.y); }

  vec3 roomColor(vec2 qg, vec3 Vt, vec2 room0, vec2 room1, float depthR, float rs, float lit, float shop) {
    vec3 o = vec3(qg, 0.0);
    vec3 d = normalize(vec3(-Vt.x, -Vt.y, max(Vt.z, 0.05)));
    float tx = ((d.x > 0.0 ? room1.x : room0.x) - o.x) / d.x;
    float ty = ((d.y > 0.0 ? room1.y : room0.y) - o.y) / d.y;
    float tz = depthR / d.z;
    float t = min(min(tx, ty), tz);
    vec3 h = o + d * t;
    vec3 wallp = mix(vec3(0.62, 0.55, 0.45), vec3(0.45, 0.52, 0.48), step(0.6, rs));
    wallp = mix(wallp, vec3(0.7, 0.62, 0.55), step(0.85, rs));
    vec3 base;
    float lampK = 1.0;
    if (t == tz) {
      base = wallp;
      // furniture silhouettes against the back wall
      float fx = h.x - (rs - 0.5) * 1.2;
      if (h.y < room0.y + 0.85 && abs(fx) < 0.8) base = mix(vec3(0.22, 0.16, 0.12), vec3(0.35, 0.3, 0.42), step(0.5, fract(rs * 7.3)));
      if (shop > 0.5 && fract((h.y - room0.y) / 0.55) < 0.12) base *= 0.5;
      if (shop > 0.5) base = mix(base, vec3(0.8, 0.55, 0.35) * (0.6 + 0.8 * hash12(floor(h.xy * 3.0))), step(0.12, fract((h.y - room0.y) / 0.55)) * step(room0.y + 0.4, h.y));
      // picture frame
      if (shop < 0.5 && abs(fx + 0.2) < 0.35 && abs(h.y - room0.y - 1.6) < 0.25) base = vec3(0.7, 0.62, 0.4);
    } else if (t == tx) {
      base = wallp * 0.85;
    } else if (d.y < 0.0) {
      base = mix(vec3(0.34, 0.22, 0.13), vec3(0.45, 0.32, 0.2), step(0.5, fract(h.z * 3.0 + h.x * 0.3)));
    } else {
      base = vec3(0.78, 0.76, 0.72);
      lampK = 1.3;
    }
    float depthF = clamp(h.z / depthR, 0.0, 1.0);
    vec3 dayL = (uZenith * 0.7 + uHorizon * 0.5 + vec3(0.02)) * uDay * (0.55 - depthF * 0.3);
    vec2 lampP = vec2((room0.x + room1.x) * 0.5, room1.y - 0.3);
    float ld = length(vec3(h.xy - lampP, h.z - depthR * 0.5));
    vec3 lampC = mix(vec3(1.0, 0.68, 0.38), vec3(1.0, 0.82, 0.62), step(0.7, fract(rs * 13.1)));
    vec3 lampL = lampC * lit * (2.2 / (1.0 + ld * ld * 0.35)) * lampK;
    // occasional TV glow
    if (fract(rs * 31.7) > 0.93) lampL += vec3(0.25, 0.35, 0.6) * lit * (0.6 + 0.4 * sin(uTime * 7.0 + rs * 20.0) * sin(uTime * 3.1));
    if (shop > 0.5) lampL = vec3(1.0, 0.8, 0.55) * (1.6 * uNight + 0.5) * (1.0 - depthF * 0.4);
    return base * (dayL + lampL);
  }

  void facade() {
    float seed = vF.x, fh = vF.y, nfl = vF.z, W = vF.w;
    float gType = vS.x, shutI = vS.y, wStyle = vS.z, flags = vS.w;
    bool party = mod(flags, 2.0) > 0.5;
    bool quoins = mod(floor(flags / 2.0), 2.0) > 0.5;
    float balMode = mod(floor(flags / 4.0), 4.0);
    vec2 p = vUvM;
    vec3 N = normalize(vNW);
    vec3 T, B;
    faceFrame(N, T, B);
    vec3 V = normalize(cameraPosition - vWPos);
    vec3 Vt = vec3(dot(V, T), dot(V, B), dot(V, N));
    float gh = 4.2;
    float topY = gh + (nfl - 1.0) * fh;
    vec3 wallC = vColor.rgb;
    vec3 trimC = vec3(0.86, 0.82, 0.74);
    float n1 = texture2D(uNoise, (p + seed * 37.0) * vec2(0.07, 0.05)).r;
    float n2 = texture2D(uNoise, (p + seed * 11.0) * 0.8).b;
    float n3 = texture2D(uNoise, p * 3.3).a;
    vec3 alb = wallC * (0.84 + 0.3 * n1) * (0.94 + 0.12 * n2);
    float rough = 0.88;
    vec3 nt = vec3((n3 - 0.5) * 0.14, (n2 - 0.5) * 0.1, 1.0);
    vec3 emis = vec3(0.0);
    float ao = 1.0;
    alb *= mix(0.7, 1.0, smoothstep(-0.2, 1.8, p.y + n1 * 0.6));
    // soft darkening below the roof line
    ao *= mix(0.78, 1.0, smoothstep(0.0, 0.9, topY - p.y + 0.3));

    // stone plinth
    if (p.y < 0.72) {
      float row = floor(p.y / 0.36);
      float bx = fract(p.x / 0.9 + row * 0.5);
      float by = fract(p.y / 0.36);
      float m = min(min(bx, 1.0 - bx) * 0.9, min(by, 1.0 - by) * 0.36);
      float hb = hash12(vec2(floor(p.x / 0.9 + row * 0.5), row) + seed);
      alb = vec3(0.52, 0.49, 0.44) * (0.8 + 0.3 * hb) * (0.9 + 0.2 * n2);
      alb = mix(alb * 0.55, alb, smoothstep(0.0, 0.025, m));
      nt = vec3(0.0, 0.0, 1.0) + vec3((bx - 0.5) * 0.4, (by - 0.5) * 0.4, 0.0) * (1.0 - smoothstep(0.0, 0.06, m));
      rough = 0.85;
    }
    // quoins on the corners
    if (quoins && p.y > 0.72 && p.y < topY) {
      float rowq = floor((p.y - 0.72) / 0.45);
      float qw = mod(rowq, 2.0) < 0.5 ? 0.9 : 0.55;
      float dx = min(p.x, W - p.x);
      if (dx < qw) {
        float by = fract((p.y - 0.72) / 0.45);
        alb = trimC * (0.86 + 0.14 * n2);
        float m = min(min(by, 1.0 - by) * 0.45, qw - dx);
        alb = mix(alb * 0.6, alb, smoothstep(0.0, 0.03, m));
        rough = 0.75;
      }
    }
    // string course between floors
    if (wStyle > 0.5 && p.y > gh - 0.25 && p.y < topY) {
      float fy = mod(p.y - gh + 0.25, fh);
      if (fy < 0.25) { alb = trimC * (0.9 + 0.1 * n2); nt = vec3(0.0, (fy - 0.125) * 5.0, 1.0); rough = 0.7; }
    }

    if (!party && p.y < topY - 0.25 && p.y > 0.0) {
      float nb = max(1.0, floor(W / 3.1 + 0.3));
      float bw = W / nb;
      float bi = floor(p.x / bw);
      float cx = (fract(p.x / bw) - 0.5) * bw;
      bool ground = p.y < gh;
      float fi = ground ? 0.0 : floor((p.y - gh) / fh) + 1.0;
      float fy = ground ? p.y : p.y - gh - (fi - 1.0) * fh;
      float rs = hash12(vec2(bi, fi) + seed * 13.1);
      bool shop = ground && gType > 0.5 && gType < 1.5;
      bool door = ground && !shop && bi == floor(nb * 0.5);
      bool balc = !ground && ((balMode == 1.0) || (balMode == 2.0 && bi == floor(nb * 0.5)) || (balMode == 3.0 && fi == 1.0));
      float ww, wh, sill;
      if (shop) { ww = bw * 0.8; wh = 3.0; sill = 0.45; }
      else if (door) { ww = 1.25; wh = 2.6; sill = 0.0; }
      else if (ground) { ww = min(1.1, bw * 0.42); wh = 1.7; sill = 1.1; }
      else if (balc) { ww = min(1.25, bw * 0.46); wh = 2.35; sill = 0.05; }
      else if (wStyle > 1.5) { ww = min(1.25, bw * 0.46); wh = 2.1; sill = 0.45; }
      else { ww = min(1.05, bw * 0.4); wh = 1.6; sill = 0.9; }
      vec2 hw = vec2(ww, wh) * 0.5;
      vec2 q = vec2(cx, fy - sill - hw.y);
      float dOpen = sdBox(q, hw);
      float trimW = shop ? 0.06 : 0.12;
      vec3 frameC = mod(seed * 7.0, 3.0) < 1.0 ? vec3(0.1, 0.17, 0.13) : vec3(0.85, 0.83, 0.78);
      if (shop) frameC = mix(vec3(0.08, 0.12, 0.14), vec3(0.32, 0.12, 0.08), step(0.5, fract(seed * 3.7)));
      vec3 shutC = shutI < 1.5 ? vec3(0.12, 0.24, 0.16) : shutI < 2.5 ? vec3(0.14, 0.24, 0.38) : shutI < 3.5 ? vec3(0.34, 0.2, 0.12) : vec3(0.4, 0.45, 0.32);

      // architrave
      if (dOpen > 0.0 && dOpen < trimW && !(door && q.y < -hw.y + 0.01)) {
        alb = trimC * (0.88 + 0.12 * n2);
        rough = 0.72;
        vec2 g = abs(q) - hw;
        vec2 dir = g.x > g.y ? vec2(sign(q.x), 0.0) : vec2(0.0, sign(q.y));
        nt = vec3(dir * (0.25 - dOpen / trimW * 0.5), 1.0);
        ao *= 0.95;
      }
      // sill ledge
      if (!ground && !balc && abs(q.x) < hw.x + 0.18 && q.y < -hw.y - 0.0 && q.y > -hw.y - 0.13) {
        alb = trimC * 0.92; nt = vec3(0.0, 0.7, 0.7); rough = 0.7;
      }
      // drip stain below sills
      if (!ground && abs(q.x) < hw.x && q.y < -hw.y - 0.13) {
        float st = (1.0 - smoothstep(0.0, 1.2, -q.y - hw.y)) * (0.5 + 0.5 * texture2D(uNoise, vec2(p.x * 2.0, p.y * 0.2)).g);
        alb *= 1.0 - st * 0.18;
      }
      // open shutters
      if (shutI > 0.5 && !ground && !balc) {
        float sx = abs(q.x) - hw.x - trimW;
        if (sx > 0.0 && sx < hw.x * 0.98 && abs(q.y) < hw.y) {
          float l = fract(q.y / 0.075);
          alb = shutC * (0.75 + 0.35 * l) * (0.9 + 0.1 * n2);
          nt = vec3(0.0, (l - 0.5) * 1.2, 1.0);
          rough = 0.6;
          ao *= 0.9;
        }
      }
      if (dOpen < 0.0) {
        float rd = shop ? 0.1 : 0.22;
        vec2 qg = q - Vt.xy / max(Vt.z, 0.06) * rd;
        if (sdBox(qg, hw) > 0.0) {
          // reveal of the recess
          alb = wallC * 0.6; rough = 0.9; ao *= 0.72;
          vec2 g = abs(qg) - hw;
          nt = g.x > g.y ? vec3(-sign(qg.x), 0.0, 0.25) : vec3(0.0, -sign(qg.y), 0.25);
        } else {
          bool closed = shutI > 0.5 && !ground && !balc && rs < 0.16;
          float F = 0.04 + 0.96 * pow(1.0 - clamp(Vt.z, 0.0, 1.0), 5.0);
          float lit = step(0.52, hash12(vec2(bi * 3.1 + fi, seed * 7.7))) * uNight;
          if (closed) {
            float l = fract(qg.y / 0.075);
            alb = shutC * (0.75 + 0.35 * l);
            nt = vec3(0.0, (l - 0.5) * 1.2, 1.0);
            rough = 0.6;
            emis = vec3(1.0, 0.7, 0.4) * lit * 0.25 * step(0.8, l);
          } else if (door && qg.y < hw.y - 0.62) {
            // panelled wooden door
            vec3 dc = mod(seed * 5.0, 4.0) < 1.0 ? vec3(0.09, 0.19, 0.13) : mod(seed * 5.0, 4.0) < 2.0 ? vec3(0.28, 0.07, 0.06) : mod(seed * 5.0, 4.0) < 3.0 ? vec3(0.08, 0.12, 0.24) : vec3(0.3, 0.19, 0.1);
            vec2 pc = vec2(abs(qg.x), qg.y + hw.y);
            float panel = step(0.09, pc.x) * step(pc.x, 0.52) * (step(0.18, pc.y) * step(pc.y, 0.95) + step(1.1, pc.y) * step(pc.y, 1.85));
            alb = dc * (0.85 + 0.15 * n2) * (1.0 - panel * 0.18);
            nt = vec3(0.0, 0.0, 1.0);
            rough = 0.5;
            if (abs(qg.x - 0.45) < 0.03 && abs(qg.y + hw.y - 1.05) < 0.03) { alb = vec3(0.8, 0.65, 0.3); rough = 0.3; }
          } else {
            float frameD = -sdBox(qg, hw);
            bool isFrame = frameD < 0.06;
            if (!shop) {
              if (abs(qg.x) < 0.026) isFrame = true;
              if (abs(qg.y - hw.y * 0.42) < 0.026 && !door) isFrame = true;
              if (door && abs(qg.y - (hw.y - 0.62)) < 0.04) isFrame = true;
            } else {
              if (abs(mod(qg.x + hw.x, ww / 3.0) - 0.0) < 0.035) isFrame = true;
              if (abs(qg.y - (hw.y - 0.55)) < 0.035) isFrame = true;
            }
            if (isFrame) { alb = frameC; rough = 0.45; nt = vec3(0.0, 0.0, 1.0); }
            else {
              alb = vec3(0.012, 0.014, 0.016);
              rough = 0.04 + n3 * 0.03;
              nt = vec3((n2 - 0.5) * 0.01, 0.0, 1.0);
              // curtains
              float cw = fract(rs * 7.7) * 0.5;
              vec3 curC = fract(rs * 5.3) < 0.5 ? vec3(0.8, 0.78, 0.72) : fract(rs * 5.3) < 0.8 ? vec3(0.7, 0.5, 0.45) : vec3(0.55, 0.6, 0.66);
              vec2 room0 = vec2(-bw * 0.5, -hw.y - sill);
              vec2 room1 = vec2(bw * 0.5, room0.y + (ground ? gh : fh) - 0.05);
              float sh = shop ? 1.0 : 0.0;
              if (!shop && abs(qg.x) > hw.x * (1.0 - cw)) {
                float fold = 0.8 + 0.2 * sin(qg.x * 40.0);
                emis = curC * fold * (uDay * (uZenith + uHorizon) * 0.35 + lit * vec3(1.0, 0.7, 0.4) * 1.1);
                alb = curC * 0.1;
                rough = 0.8;
              } else {
                emis = roomColor(qg, Vt, room0, room1, shop ? 5.0 : 3.8, rs, lit, sh);
              }
              emis *= (1.0 - F);
            }
          }
        }
      }
    }
    fAlb = alb * ao;
    fRough = rough;
    fNT = normalize(nt);
    fEmis = emis;
  }
`;

function makeFacadeMaterial() {
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0 });

    fHead: FACADE_FRAG,

    fNormal: /* glsl */ `
      { vec3 N = normalize(vNW); vec3 T, B; faceFrame(N, T, B);

// --- roofs --------------------------------------------------------------------
function makeRoofMaterial() {
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, metalness: 0, side: THREE.DoubleSide });
  patch(mat, {
    key: 'roof',
    vHead: 'attribute vec4 aR; varying vec2 vUvM; varying vec4 vR; varying vec3 vNW;',
    vEnd: 'vUvM = uv; vR = aR; vNW = normalize(mat3(modelMatrix) * objectNormal);',
    fHead: /* glsl */ `
      varying vec2 vUvM; varying vec4 vR; varying vec3 vNW;
      ${GLSL_FRAME}
      vec3 rAlb; float rRough; vec3 rNT; float rMetal;
      void roof() {
        vec2 p = vUvM;
        float style = vR.x, seed = vR.y;
        vec3 base = vColor.rgb;
        float n1 = texture2D(uNoise, (p + seed * 19.0) * 0.06).r;
        float n2 = texture2D(uNoise, p * 0.9 + seed).b;
        rMetal = 0.0;
        if (style < 0.5) {
          float row = floor(p.y / 0.31);
          float fy = fract(p.y / 0.31);
          float off = mod(row, 2.0) * 0.5;
          float col = floor(p.x / 0.23 + off);
          float fx = fract(p.x / 0.23 + off);
          float th = hash12(vec2(col, row) + seed * 3.0);
          vec3 c = base * (0.72 + 0.5 * th) * (0.85 + 0.3 * n1);
          float moss = smoothstep(0.55, 0.85, texture2D(uNoise, p * 0.18 + seed).g) * 0.6;
          c = mix(c, vec3(0.28, 0.3, 0.16), moss * 0.55);
          c = mix(c, c * 1.25 + 0.03, smoothstep(0.65, 0.9, n2) * 0.3);
          float lap = smoothstep(0.0, 0.16, fy);
          float prof = sin(fx * 3.14159);
          c *= mix(0.45, 1.0, lap) * (0.72 + 0.28 * prof);
          rAlb = c;
          rNT = vec3(cos(fx * 3.14159) * 0.75, (1.0 - lap) * 0.9, 1.0);
          rRough = 0.68;
        } else if (style < 1.5) {
          float row = floor(p.y / 0.22);
          float fy = fract(p.y / 0.22);
          float off = mod(row, 2.0) * 0.5;
          float col = floor(p.x / 0.3 + off);
          float fx = fract(p.x / 0.3 + off);
          float th = hash12(vec2(col, row) + seed * 5.0);
          vec3 c = base * (0.75 + 0.4 * th) * (0.9 + 0.2 * n1);
          float edge = smoothstep(0.0, 0.05, min(fx, 1.0 - fx));
          float lap = smoothstep(0.0, 0.1, fy);
          c *= mix(0.5, 1.0, lap) * mix(0.75, 1.0, edge);
          c = mix(c, vec3(0.3, 0.32, 0.2), smoothstep(0.7, 0.9, texture2D(uNoise, p * 0.2 + seed).g) * 0.3);
          rAlb = c;
          rNT = vec3(0.0, (1.0 - lap) * 0.7, 1.0);
          rRough = 0.52;
        } else if (style < 2.5) {
          vec3 c = base * (0.78 + 0.35 * n1) * (0.85 + 0.3 * texture2D(uNoise, p * 3.1).a);
          rAlb = c;
          rNT = vec3((n2 - 0.5) * 0.2, 0.0, 1.0);
          rRough = 0.95;
        } else {
          vec3 c = mix(vec3(0.22, 0.46, 0.38), vec3(0.38, 0.58, 0.48), n1);
          c = mix(c, vec3(0.32, 0.24, 0.14), smoothstep(0.7, 0.95, texture2D(uNoise, vec2(p.x * 1.5, p.y * 0.15)).g) * 0.5);
          float seam = smoothstep(0.0, 0.04, abs(fract(p.x / 0.6) - 0.5) - 0.46);
          rAlb = c * (1.0 - seam * 0.3);
          rNT = vec3(seam * 0.5, 0.0, 1.0);
          rRough = 0.5;
          rMetal = 0.25;
        }
      }
    `,
    fColor: 'roof(); diffuseColor.rgb = rAlb;',
    fRough: 'roughnessFactor = rRough; metalnessFactor = rMetal;',
    fNormal: /* glsl */ `
      { vec3 N = normalize(vNW) * (gl_FrontFacing ? 1.0 : -1.0); vec3 T, B; faceFrame(N, T, B);
        vec3 nw = normalize(T * rNT.x + B * rNT.y + N * rNT.z);
        normal = normalize((viewMatrix * vec4(nw, 0.0)).xyz); }
    `,
  });
  return mat;
}

// --- ashlar stone (quays, canal walls, bridges, towers) --------------------------
function makeStoneMaterial() {
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0 });
  patch(mat, {
    key: 'stone',
    vHead: 'varying vec2 vUvM; varying vec3 vNW;',
    vEnd: 'vUvM = uv; vNW = normalize(mat3(modelMatrix) * objectNormal);',
    fHead: /* glsl */ `
      varying vec2 vUvM; varying vec3 vNW;
      ${GLSL_FRAME}
      vec3 sAlb; float sRough; vec3 sNT;
      void stone() {
        vec2 p = vUvM;
        float row = floor(p.y / 0.42);
        float by = fract(p.y / 0.42);
        float len = 0.9 + 0.35 * hash11(row * 3.1);
        float bx = fract(p.x / len + hash11(row) );
        float id = floor(p.x / len + hash11(row));
        float hb = hash12(vec2(id, row));
        float m = min(min(bx, 1.0 - bx) * len, min(by, 1.0 - by) * 0.42);
        float n1 = texture2D(uNoise, p * 0.7).b;
        float n2 = texture2D(uNoise, p * 0.08).r;
        vec3 c = vColor.rgb * (0.78 + 0.34 * hb) * (0.85 + 0.3 * n1) * (0.9 + 0.2 * n2);
        c = mix(c * 0.45, c, smoothstep(0.0, 0.03, m));
        float y = vWPos.y;
        float wet = 1.0 - smoothstep(0.1, 0.6, y - sin(uTime * 0.8 + vWPos.x * 0.1) * 0.08);
        c = mix(c, c * vec3(0.45, 0.5, 0.42), wet);
        float algae = smoothstep(-0.9, -0.1, y) * (1.0 - smoothstep(-0.1, 0.45, y));
        c = mix(c, vec3(0.1, 0.16, 0.08), algae * 0.75);
        float moss = smoothstep(0.62, 0.85, texture2D(uNoise, p * 0.15).g) * smoothstep(3.5, 0.5, y);
        c = mix(c, vec3(0.16, 0.22, 0.08), moss * 0.4);
        sAlb = c;
        sRough = mix(0.85, 0.3, wet);
        vec2 bevel = vec2(bx - 0.5, by - 0.5) * 0.5 * (1.0 - smoothstep(0.0, 0.07, m));
        sNT = normalize(vec3(bevel + (vec2(n1, texture2D(uNoise, p * 0.7 + 0.5).b) - 0.5) * 0.25, 1.0));
      }
    `,
    fColor: 'stone(); diffuseColor.rgb = sAlb;',
    fRough: 'roughnessFactor = sRough;',
    fNormal: /* glsl */ `
      { vec3 N = normalize(vNW); vec3 T, B; faceFrame(N, T, B);
        vec3 nw = normalize(T * sNT.x + B * sNT.y + N * sNT.z);
        normal = normalize((viewMatrix * vec4(nw, 0.0)).xyz); }
    `,
  });
  return mat;
}

      vec3 wpF = (modelMatrix * vec4(position, 1.0)).xyz;
      transformed.y += sin(uTime * 3.2 + wpF.x * 1.3 + wpF.z) * 0.035 * flut * (0.3 + uWind.z);
    `,
    vEnd: 'vC = aC; vUvF = uv;',

      reflectedLight.directDiffuse += directLight.color * diffuseColor.rgb * 0.25 * max(0.0, -dot(normal, directLight.direction));
    `,
  });
  return mat;
}

// ---- 09_city.js ----
// ============================================================================
// City generator: street grid, canal, sidewalks, quays, bridges, row houses
// (walls/roofs/balconies/awnings/chimneys), street furniture, walk grid.
// ============================================================================

const V3 = THREE.Vector3;
const MATS = {};
const CITYDATA = { blocks: [], courtyards: [], lamps: [], benches: [], streetTrees: [], canalTrees: [], plazaTrees: [], buildings: [], bridges: [], piers: [], cafes: [] };

// --- tiled geometry builders (spatial tiles => frustum culling works) ---------
const TILE = 140;
const TB = new Map();
function tb(kind, x, z) {
  const tx = Math.floor(x / TILE), tz = Math.floor(z / TILE);
  const key = kind + ':' + tx + ':' + tz;
  let b = TB.get(key);
  if (!b) {
    const extra = { walls: { aF: 4, aS: 4 }, roofs: { aR: 4 }, props: { aP: 3 }, fabric: { aC: 4 } }[kind] || {};
    b = new GeoBuilder(extra, { aP: [0.8, 0, 0] });
    b.kind = kind;
    TB.set(key, b);
  }
  return b;
}

function faceFrameJS(N) {
  const T = new V3().crossVectors(new V3(0, 1, 0), N);
  if (T.lengthSq() < 1e-4) T.set(1, 0, 0); else T.normalize();
  const B = new V3().crossVectors(N, T);
  return [T, B];
}
const worldUV = (P, N) => { const [T, B] = faceFrameJS(N); return [P.dot(T), P.dot(B)]; };
const scaledXZ = (s) => (P) => [P.x / s, -P.z / s];

// quad in world space with uv computed from a function (P, N) -> [u, v]
function quadW(b, a, bb, c, d, color, ex = {}, uvFn = worldUV) {
  const n = new V3().subVectors(bb, a).cross(new V3().subVectors(c, a)).normalize();
  b.quad(a, bb, c, d, n, [uvFn(a, n), uvFn(bb, n), uvFn(c, n), uvFn(d, n)], color, ex);
}

// oriented box; faces: set of 'px nx py ny pz nz'
function boxW(b, cx, cy, cz, sx, sy, sz, rot = 0, color = [1, 1, 1], ex = {}, faces = 'px nx py ny pz nz', uvFn = worldUV) {
  const c = Math.cos(rot), s = Math.sin(rot);
  const P = (x, y, z) => new V3(cx + x * c + z * s, cy + y, cz - x * s + z * c);
  const hx = sx / 2, hy = sy / 2, hz = sz / 2;
  const F = {
    px: [[hx, -hy, hz], [hx, -hy, -hz], [hx, hy, -hz], [hx, hy, hz]],
    nx: [[-hx, -hy, -hz], [-hx, -hy, hz], [-hx, hy, hz], [-hx, hy, -hz]],
    py: [[-hx, hy, hz], [hx, hy, hz], [hx, hy, -hz], [-hx, hy, -hz]],
    ny: [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz]],
    pz: [[-hx, -hy, hz], [hx, -hy, hz], [hx, hy, hz], [-hx, hy, hz]],
    nz: [[hx, -hy, -hz], [-hx, -hy, -hz], [-hx, hy, -hz], [hx, hy, -hz]],
  };
  for (const f of faces.split(' ')) {
    const q = F[f]; if (!q) continue;
    quadW(b, P(...q[0]), P(...q[1]), P(...q[2]), P(...q[3]), color, ex, uvFn);
  }
}
// append a three.js geometry with transform
const _mtx = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new V3();
function addGeo(b, g, x, y, z, rotY = 0, sc = 1, color = [1, 1, 1], ex = {}, rotX = 0) {
  _q.setFromEuler(new THREE.Euler(rotX, rotY, 0, 'YXZ'));
  _mtx.compose(new V3(x, y, z), _q, typeof sc === 'number' ? _s.set(sc, sc, sc) : sc);
  b.add(g, _mtx, color, ex);
}

// --- walk grid (ground height + blocked) ------------------------------------------
const WG = { x0: -320, z0: -260, w: 640, h: 480, res: 1, H: null, B: null };
function initWalkGrid() {
  WG.H = new Float32Array(WG.w * WG.h);
  WG.B = new Uint8Array(WG.w * WG.h);
  for (let j = 0; j < WG.h; j++) for (let i = 0; i < WG.w; i++) {
    const x = WG.x0 + i + 0.5, z = WG.z0 + j + 0.5;
    const h = heightAt(x, z);
    WG.H[j * WG.w + i] = h;
    WG.B[j * WG.w + i] = h < 0.25 ? 1 : 0;
  }
}
function wgRect(x0, z0, x1, z1, fn) {
  const i0 = Math.max(0, Math.floor(Math.min(x0, x1) - WG.x0)), i1 = Math.min(WG.w - 1, Math.ceil(Math.max(x0, x1) - WG.x0) - 1);
  const j0 = Math.max(0, Math.floor(Math.min(z0, z1) - WG.z0)), j1 = Math.min(WG.h - 1, Math.ceil(Math.max(z0, z1) - WG.z0) - 1);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) fn(j * WG.w + i, WG.x0 + i + 0.5, WG.z0 + j + 0.5);
}
function wgSet(x0, z0, x1, z1, h, blocked = 0) {
  wgRect(x0, z0, x1, z1, (k) => { if (h !== null) WG.H[k] = h; WG.B[k] = blocked; });
}
function wgBlockOriented(cx, cz, w, d, rot, pad = 0.3) {
  const c = Math.cos(rot), s = Math.sin(rot);
  const r = Math.hypot(w, d) / 2 + 1;
  wgRect(cx - r, cz - r, cx + r, cz + r, (k, x, z) => {
    const dx = x - cx, dz = z - cz;
    const lx = dx * c - dz * s, lz = dx * s + dz * c;
    if (Math.abs(lx) < w / 2 + pad && Math.abs(lz) < d / 2 + pad) WG.B[k] = 1;
  });
}
function cityWalkInfo(x, z) {
  const i = Math.floor(x - WG.x0), j = Math.floor(z - WG.z0);
  if (i < 0 || j < 0 || i >= WG.w || j >= WG.h) { const h = heightAt(x, z); return { h, blocked: h < 0.25 }; }
  const k = j * WG.w + i;
  return { h: WG.H[k], blocked: WG.B[k] === 1 };
}

// --- palettes ---------------------------------------------------------------------
const WALL_COLS = ['#e9dcbf', '#ecc995', '#dca075', '#c98663', '#e6b9a4', '#bccab0', '#aec3cc', '#f1e8d6', '#dcc47f', '#cfae90', '#a8b9a6', '#e5d2b2', '#d7b8c2', '#f0d9a8'].map(srgb);
const ROOF_CLAY = ['#a8522f', '#b9663d', '#934b2d', '#a45a38', '#b0583a'].map(srgb);
const ROOF_SLATE = ['#4c525b', '#434951', '#5a5f66'].map(srgb);
const AWNING = [['#2f5d4a', '#efe6d2'], ['#9c3a2e', '#f1e7d4'], ['#27405e', '#f0ead8'], ['#c68a2e', '#f2ead6'], ['#5b3a52', '#eee4d2']].map(([a, b]) => [srgb(a), srgb(b)]);
const TRIM = srgb('#ddd4c4');

// --- one building -----------------------------------------------------------------
// o: {cx, cz, w, d, rot, baseY, floors, fh, color, roof, roofColor, roofStyle,
//     party:{left,right,back}, gType, shutI, wStyle, balMode, quoins, seed, awning, flowers}
function addBuilding(o) {
  const gh = 4.2;
  const H = o.floors <= 1 ? gh : gh + (o.floors - 1) * o.fh;
  const c = Math.cos(o.rot), s = Math.sin(o.rot);
  const L = (x, y, z) => new V3(o.cx + x * c + z * s, o.baseY + y, o.cz - x * s + z * c);
  const w = o.w, d = o.d;
  const wb = tb('walls', o.cx, o.cz), rb = tb('roofs', o.cx, o.cz), pb = tb('props', o.cx, o.cz);
  const flat = o.roof === 'flat';
  const topWall = flat ? H + 1.0 : H;
  const plinthDrop = o.plinth || 0; // extra wall below base (hillside)
  const walls = [
    { a: [-w / 2, d / 2], b: [w / 2, d / 2], W: w, party: false, g: o.gType },
    { a: [w / 2, d / 2], b: [w / 2, -d / 2], W: d, party: o.party.right, g: 0 },
    { a: [w / 2, -d / 2], b: [-w / 2, -d / 2], W: w, party: o.party.back, g: 0 },
    { a: [-w / 2, -d / 2], b: [-w / 2, d / 2], W: d, party: o.party.left, g: 0 },
  ];
  for (const wl of walls) {
    const flags = (wl.party ? 1 : 0) + (o.quoins ? 2 : 0) + (wl === walls[0] ? o.balMode * 4 : 0);
    const ex = { aF: [o.seed, o.fh, o.floors, wl.W], aS: [wl.g, o.shutI, o.wStyle, flags] };
    const p0 = L(wl.a[0], -plinthDrop, wl.a[1]), p1 = L(wl.b[0], -plinthDrop, wl.b[1]);
    const p2 = L(wl.b[0], topWall, wl.b[1]), p3 = L(wl.a[0], topWall, wl.a[1]);
    const n = new V3().subVectors(p1, p0).cross(new V3().subVectors(p2, p0)).normalize();
    wb.quad(p0, p1, p2, p3, n, [[0, -plinthDrop], [wl.W, -plinthDrop], [wl.W, topWall], [0, topWall]], o.color, ex);
  }
  const trimC = o.trim || TRIM;
  const pbEx = { aP: [0.75, 0, 0] };
  const roofEx = { aR: [o.roofStyle, o.seed, 0, 0] };
  const pitch = o.pitch || 0.6;
  const tn = Math.tan(pitch);
  const ov = 0.42, e = 0.22;
  const roofQuad = (a, b2, cc, dd) => {
    const n = new V3().subVectors(b2, a).cross(new V3().subVectors(cc, a)).normalize();

    const uv = (P) => [new V3().subVectors(P, a).dot(T), new V3().subVectors(P, a).dot(B)];
    rb.quad(a, b2, cc, dd, n, [uv(a), uv(b2), uv(cc), uv(dd)], o.roofColor, roofEx);

  const roofTri = (a, b2, cc) => {
    const n = new V3().subVectors(b2, a).cross(new V3().subVectors(cc, a)).normalize();
    const [T, B] = faceFrameJS(n);
    const uv = (P) => [new V3().subVectors(P, a).dot(T), new V3().subVectors(P, a).dot(B)];
    rb.tri(a, b2, cc, n, [uv(a), uv(b2), uv(cc)], o.roofColor, roofEx);

  const gableTri = (a, b2, cc, W, party) => {

    const va = a.y - o.baseY, vc = cc.y - o.baseY;
    wb.tri(a, b2, cc, n, [[0, va], [W, va], [W / 2, vc]], o.color, ex);
  };
  let ridgeY = H;
  if (o.roof === 'gable') {
    const r = (d / 2) * tn;
    ridgeY = H + r;
    const yE = H - ov * tn;
    roofQuad(L(-w / 2 - e, yE, d / 2 + ov), L(w / 2 + e, yE, d / 2 + ov), L(w / 2 + e, H + r, 0), L(-w / 2 - e, H + r, 0));
    roofQuad(L(w / 2 + e, yE, -d / 2 - ov), L(-w / 2 - e, yE, -d / 2 - ov), L(-w / 2 - e, H + r, 0), L(w / 2 + e, H + r, 0));
    gableTri(L(w / 2, H, d / 2), L(w / 2, H, -d / 2), L(w / 2, H + r, 0), d, o.party.right);
    gableTri(L(-w / 2, H, -d / 2), L(-w / 2, H, d / 2), L(-w / 2, H + r, 0), d, o.party.left);
    boxW(pb, ...L(0, H + r + 0.05, 0).toArray(), w + 2 * e + 0.05, 0.16, 0.34, o.rot, o.roofColor.map((v) => v * 0.7), pbEx);
    // eave cornice

  } else if (o.roof === 'hip') {
    const yE = H - ov * tn;
    const W2 = w / 2 + ov, D2 = d / 2 + ov;
    if (w >= d) {
      const r = (d / 2) * tn, rx = (w - d) / 2;
      ridgeY = H + r;

      roofQuad(L(W2, yE, -D2), L(-W2, yE, -D2), L(-rx, H + r, 0), L(rx, H + r, 0));
      roofTri(L(W2, yE, D2), L(W2, yE, -D2), L(rx, H + r, 0));
      roofTri(L(-W2, yE, -D2), L(-W2, yE, D2), L(-rx, H + r, 0));
      if (rx > 0.1) boxW(pb, ...L(0, H + r + 0.04, 0).toArray(), 2 * rx + 0.3, 0.14, 0.3, o.rot, o.roofColor.map((v) => v * 0.7), pbEx);
    } else {

      roofTri(L(-W2, yE, D2), L(W2, yE, D2), L(0, H + r, rz));
      roofTri(L(W2, yE, -D2), L(-W2, yE, -D2), L(0, H + r, -rz));
    }
    boxW(pb, ...L(0, H - 0.18, 0).toArray(), w + 0.24, 0.26, d + 0.24, o.rot, trimC, pbEx, 'px nx pz nz ny');

    roofQuad(L(-w / 2, yR, d / 2), L(w / 2, yR, d / 2), L(w / 2, yR, -d / 2), L(-w / 2, yR, -d / 2));
    // inner parapet faces
    const ic = o.color.map((v) => v * 0.85);
    quadW(pb, L(w / 2 - 0.02, yR, d / 2 - 0.02), L(-w / 2 + 0.02, yR, d / 2 - 0.02), L(-w / 2 + 0.02, H + 1, d / 2 - 0.02), L(w / 2 - 0.02, H + 1, d / 2 - 0.02), ic, { aP: [0.9, 0, 0] });
    quadW(pb, L(-w / 2 + 0.02, yR, -d / 2 + 0.02), L(w / 2 - 0.02, yR, -d / 2 + 0.02), L(w / 2 - 0.02, H + 1, -d / 2 + 0.02), L(-w / 2 + 0.02, H + 1, -d / 2 + 0.02), ic, { aP: [0.9, 0, 0] });
    quadW(pb, L(w / 2 - 0.02, yR, -d / 2 + 0.02), L(w / 2 - 0.02, yR, d / 2 - 0.02), L(w / 2 - 0.02, H + 1, d / 2 - 0.02), L(w / 2 - 0.02, H + 1, -d / 2 + 0.02), ic, { aP: [0.9, 0, 0] });
    quadW(pb, L(-w / 2 + 0.02, yR, d / 2 - 0.02), L(-w / 2 + 0.02, yR, -d / 2 + 0.02), L(-w / 2 + 0.02, H + 1, -d / 2 + 0.02), L(-w / 2 + 0.02, H + 1, d / 2 - 0.02), ic, { aP: [0.9, 0, 0] });
    // coping
    boxW(pb, ...L(0, H + 1.06, d / 2 - 0.1).toArray(), w + 0.1, 0.12, 0.34, o.rot, trimC, pbEx);
    boxW(pb, ...L(0, H + 1.06, -d / 2 + 0.1).toArray(), w + 0.1, 0.12, 0.34, o.rot, trimC, pbEx);
    boxW(pb, ...L(w / 2 - 0.1, H + 1.06, 0).toArray(), 0.34, 0.12, d - 0.2, o.rot, trimC, pbEx);
    boxW(pb, ...L(-w / 2 + 0.1, H + 1.06, 0).toArray(), 0.34, 0.12, d - 0.2, o.rot, trimC, pbEx);
    // roof clutter: stair hut, skylight, planters
    if (w > 7 && d > 7) {
      const hx = (rand() - 0.5) * (w - 5), hz = (rand() - 0.5) * (d - 5);
      boxW(pb, ...L(hx, yR + 1.2, hz).toArray(), 2.4, 2.4, 2.8, o.rot, o.color.map((v) => v * 0.9), { aP: [0.9, 0, 0] });
      boxW(pb, ...L(hx, yR + 2.45, hz).toArray(), 2.6, 0.1, 3.0, o.rot, [0.3, 0.3, 0.3], { aP: [0.8, 0, 0] });
      if (rand() < 0.6) {
        for (let k = 0; k < 3; k++) {
          const px = -w / 2 + 1 + rand() * (w - 2), pz = d / 2 - 1.2;
          boxW(pb, ...L(px, yR + 0.3, pz).toArray(), 1.2, 0.6, 0.6, o.rot, srgb('#9a5b3c'), { aP: [0.85, 0, 0] });
          boxW(pb, ...L(px, yR + 0.75, pz).toArray(), 1.0, 0.5, 0.5, o.rot, srgb('#4d6b2c'), { aP: [0.95, 0, 0] });
        }
      }
    }
  }
  // chimneys on pitched roofs
  if (!flat && o.floors >= 2) {
    const nC = 1 + (rand() < 0.5 ? 1 : 0);
    for (let k = 0; k < nC; k++) {
      const x = (k === 0 ? -1 : 1) * (w * (0.18 + rand() * 0.2));
      const z = (rand() - 0.5) * d * 0.25;
      const top = ridgeY + 0.9;
      const hgt = top - (H - 0.5);
      const cc = rand() < 0.5 ? srgb('#8f4f3a') : o.color.map((v) => v * 0.92);
      boxW(pb, ...L(x, H - 0.5 + hgt / 2, z).toArray(), 0.7, hgt, 0.9, o.rot, cc, { aP: [0.9, 0, 0] });
      boxW(pb, ...L(x, top + 0.05, z).toArray(), 0.9, 0.12, 1.1, o.rot, [0.25, 0.25, 0.25], { aP: [0.8, 0, 0] });

    }
  }

  const bw = w / nb;
  const railB = tb('rail', o.cx, o.cz);
  const addRail = (x0, x1, z0, z1, y) => {
    const a = L(x0, y, z0), b2 = L(x1, y, z1);

    const n = new V3().subVectors(b2, a).cross(new V3(0, 1, 0)).normalize();

  };
  if (o.balMode > 0 && o.floors >= 2) {
    for (let fi = 1; fi < o.floors; fi++) {
      const yF = gh + (fi - 1) * o.fh;
      if (o.balMode === 3 && fi !== 1) continue;
      if (o.balMode === 3) {
        boxW(pb, ...L(0, yF - 0.08, d / 2 + 0.5).toArray(), w - 0.6, 0.16, 1.0, o.rot, trimC, pbEx);

        addRail(w / 2 - 0.35, w / 2 - 0.35, d / 2 + 0.98, d / 2 + 0.02, yF);

        addRail(cx + bwid / 2 - 0.03, cx + bwid / 2 - 0.03, d / 2 + 0.88, d / 2 + 0.02, yF);
        addRail(cx - bwid / 2 + 0.03, cx - bwid / 2 + 0.03, d / 2 + 0.02, d / 2 + 0.88, yF);
        if (rand() < 0.45) { // potted plants on balconies
          boxW(pb, ...L(cx + bwid / 2 - 0.35, yF + 0.2, d / 2 + 0.6).toArray(), 0.4, 0.4, 0.4, o.rot, srgb('#a2603f'), { aP: [0.85, 0, 0] });
          CITYDATA.pots = CITYDATA.pots || [];
          CITYDATA.pots.push(L(cx + bwid / 2 - 0.35, yF + 0.45, d / 2 + 0.6));
        }
      }
    }
  }
  if (o.gType === 1) {
    const fb = tb('fabric', o.cx, o.cz);
    const [ca, cb] = o.awning;

      const cx = -w / 2 + (bi + 0.5) * bw;
      const aw = bw * 0.84;

      const c2 = L(cx + aw / 2, 3.0, d / 2 + 1.45), d2 = L(cx - aw / 2, 3.0, d / 2 + 1.45);
      const n = new V3().subVectors(b2, a).cross(new V3().subVectors(c2, a)).normalize();
