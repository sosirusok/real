    const pl = new THREE.PointLight(0xffb870, 0, 22, 1.6);
    scene.add(pl);
    LIFE.lights.push(pl);
  }
}
let lightTimer = 0;
function updateLampLights(dt) {
  lightTimer -= dt;
  const n = G.uNight.value;
  if (lightTimer <= 0) {
    lightTimer = 0.4;
    const cam = camera.position;
    const sorted = CITYDATA.lamps.map((p) => [p, p.distanceToSquared(cam)]).sort((a, b) => a[1] - b[1]).slice(0, LIFE.lights.length);
    sorted.forEach(([p], i) => LIFE.lights[i].position.copy(p).add(new V3(0, -0.2, 0)));
  }
  for (const l of LIFE.lights) l.intensity = n * 28 * smoothstep(0.3, 0.9, n);
}

// --- lighthouse beam ----------------------------------------------------------------------------
function buildLighthouseBeam() {
  const LH = CITYDATA.lighthouse;
  if (!LH) return;
  const len = 420;
  const g = new THREE.ConeGeometry(12, len, 24, 1, true).translate(0, -len / 2, 0).rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: { ...G },
    vertexShader: GLSL_COMMON + `varying vec3 vL; varying vec3 vW; void main(){ vL = position; vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: GLSL_COMMON + `varying vec3 vL; varying vec3 vW; void main(){
      float d = clamp(vL.z / ${len.toFixed(1)}, 0.0, 1.0);
      float a = (1.0 - d) * (1.0 - d) * 0.22 * smoothstep(0.4, 0.9, uNight);
      gl_FragColor = vec4(vec3(1.0, 0.92, 0.7) * a * (1.0 - fogAmount(vW) * 0.6), 1.0);
    }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  const piv = new THREE.Object3D();
  piv.position.set(LH.x, LH.y, LH.z);
  const b1 = new THREE.Mesh(g, mat), b2 = new THREE.Mesh(g, mat);
  b2.rotation.y = Math.PI;
  piv.add(b1, b2);
  b1.layers.set(LAYER_NOREFLECT); b2.layers.set(LAYER_NOREFLECT);
  scene.add(piv);
  LIFE.beam = piv;
}

function buildLife() {
  buildGulls();
  buildPigeons();
  buildButterflies();
  buildPondLife();
  buildBoats();
  buildTrams();
  buildPetals();
  buildFireflies();
  buildPollen();
  buildSmoke();
  buildFountainWater();
  buildLampLights();
  buildLighthouseBeam();
}
function updateLife(dt, t) {
  updateGulls(t, dt);
  updatePigeons(t, dt);
  updateButterflies(t);
  updatePondLife(t);
  updateBoats(t);
  updateTrams(t);
  updateLampLights(dt);
  if (LIFE.beam) LIFE.beam.rotation.y = t * 0.55;
}

// ---- 14_audio.js ----
// ============================================================================
// Generative soundscape (WebAudio, no samples): wind, waves, fountain,
// songbirds + gulls by day, crickets at night, optional gentle music
// ============================================================================

const AUD = { ctx: null, on: false, music: false };

function noiseBuffer(ctx, type = 'brown', secs = 4) {
  const n = ctx.sampleRate * secs;
  const b = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = b.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++) {
    const w = Math.random() * 2 - 1;
    if (type === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    else d[i] = w;
  }
  return b;
}
function loopNoise(ctx, buf, filterType, freq, q = 0.7) {
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const f = ctx.createBiquadFilter();
  f.type = filterType; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); g.gain.value = 0;
  src.connect(f).connect(g).connect(AUD.master);
  src.start(0, Math.random() * 3);
  return { src, f, g };
}
function reverb(ctx, secs = 3.2) {
  const n = ctx.sampleRate * secs;
  const b = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6);
  }
  const cv = ctx.createConvolver();
  cv.buffer = b;
  return cv;
}

function initAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return false;
  const ctx = new Ctx();
  AUD.ctx = ctx;
  AUD.master = ctx.createGain();
  AUD.master.gain.value = 0;
  AUD.master.connect(ctx.destination);
  AUD.verb = reverb(ctx);
  AUD.verbGain = ctx.createGain(); AUD.verbGain.gain.value = 0.35;
  AUD.verb.connect(AUD.verbGain).connect(AUD.master);
  const brown = noiseBuffer(ctx, 'brown'), white = noiseBuffer(ctx, 'white', 2);
  AUD.wind = loopNoise(ctx, brown, 'lowpass', 420, 0.5);
  AUD.waves = loopNoise(ctx, brown, 'lowpass', 900, 0.4);
  AUD.fount = loopNoise(ctx, white, 'bandpass', 2400, 0.5);
  AUD.crick = ctx.createOscillator(); AUD.crick.frequency.value = 4300;
  const am = ctx.createOscillator(); am.type = 'square'; am.frequency.value = 28;
  const amG = ctx.createGain(); amG.gain.value = 0.5;
  AUD.crickG = ctx.createGain(); AUD.crickG.gain.value = 0;
  const cg2 = ctx.createGain(); cg2.gain.value = 0.5;
  am.connect(amG).connect(cg2.gain);
  AUD.crick.connect(cg2).connect(AUD.crickG).connect(AUD.master);
  AUD.crick.start(); am.start();
  AUD.musicBus = ctx.createGain(); AUD.musicBus.gain.value = 0;
  AUD.musicBus.connect(AUD.master);
  AUD.musicBus.connect(AUD.verb);
  AUD.nextBird = 0; AUD.nextNote = 0; AUD.nextChord = 0; AUD.chord = 0;
  return true;
}

function setAudio(on) {
  if (on && !AUD.ctx && !initAudio()) return;
  AUD.on = on;
  if (!AUD.ctx) return;
  if (on && AUD.ctx.state === 'suspended') AUD.ctx.resume();
  AUD.master.gain.setTargetAtTime(on ? 0.9 : 0, AUD.ctx.currentTime, 0.4);
}
function setMusic(on) {
  if (on && !AUD.ctx) setAudio(true);
  AUD.music = on;
  if (AUD.ctx) AUD.musicBus.gain.setTargetAtTime(on ? 0.22 : 0, AUD.ctx.currentTime, 1.2);
}

function chirp(t, pan, base) {
  const ctx = AUD.ctx;
  const n = 2 + Math.floor(Math.random() * 5);
  const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const out = ctx.createGain(); out.gain.value = 0.05 + Math.random() * 0.05;
  if (p) { p.pan.value = pan; out.connect(p).connect(AUD.master); } else out.connect(AUD.master);
  out.connect(AUD.verb);
  for (let i = 0; i < n; i++) {
    const o = ctx.createOscillator(); o.type = 'sine';
    const g = ctx.createGain();
    const t0 = t + i * (0.09 + Math.random() * 0.05);
    const f0 = base * (0.9 + Math.random() * 0.3);
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f0 * (1.3 + Math.random() * 0.5), t0 + 0.05);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.85, t0 + 0.08);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(1, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.085);
    o.connect(g).connect(out);
    o.start(t0); o.stop(t0 + 0.1);
  }
}
function gullCall(t, pan) {
  const ctx = AUD.ctx;
  const o = ctx.createOscillator(); o.type = 'sawtooth';
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500; f.Q.value = 3;
  const g = ctx.createGain();
  const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  o.frequency.setValueAtTime(900, t);
  o.frequency.linearRampToValueAtTime(1500, t + 0.12);
  o.frequency.linearRampToValueAtTime(1000, t + 0.45);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.035, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  o.connect(f).connect(g);
  if (p) { p.pan.value = pan; g.connect(p).connect(AUD.master); } else g.connect(AUD.master);
  g.connect(AUD.verb);
  o.start(t); o.stop(t + 0.55);
}
const PENTA = [0, 2, 4, 7, 9];
function note(t, midi, dur, vel) {
  const ctx = AUD.ctx;
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vel, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  for (const [mult, amp, type] of [[1, 1, 'sine'], [2, 0.18, 'sine'], [3, 0.06, 'triangle']]) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f * mult;
    const og = ctx.createGain(); og.gain.value = amp;
    o.connect(og).connect(g);
    o.start(t); o.stop(t + dur + 0.1);
  }
  g.connect(AUD.musicBus);
}
function pad(t, midis, dur) {
  const ctx = AUD.ctx;
  for (const m of midis) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = o.frequency.value * 1.003;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05, t + dur * 0.4);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); o2.connect(g); g.connect(AUD.musicBus);
    o.start(t); o2.start(t); o.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
  }
}

function updateAudio() {
  if (!AUD.ctx || !AUD.on) return;
  const ctx = AUD.ctx, now = ctx.currentTime;
  const cam = camera.position;
  const w = G.uWind.value.z;
  const day = G.uDay.value, night = G.uNight.value;
  // distances
  const seaD = Math.max(0, 146 - cam.z);
  const seaK = clamp(1 - seaD / 260, 0, 1) * (cam.z > 146 ? 1 : 0.7) + (cam.x < -250 ? 0.4 : 0);
  const F = CITYDATA.fountain;
  const fd = F ? Math.hypot(cam.x - F.x, cam.z - F.z, cam.y - F.y) : 999;
  const alt = clamp(cam.y / 120, 0, 1);
  const swell = 0.6 + 0.4 * Math.sin(now * 0.55) * Math.sin(now * 0.23 + 1);
  AUD.wind.g.gain.setTargetAtTime((0.05 + w * 0.3) * (0.5 + alt * 0.8), now, 0.5);
  AUD.wind.f.frequency.setTargetAtTime(300 + w * 500 + alt * 300, now, 0.5);
  AUD.waves.g.gain.setTargetAtTime(clamp(seaK, 0, 1) * 0.32 * swell * (0.6 + w * 0.6), now, 0.3);
  AUD.fount.g.gain.setTargetAtTime(clamp(1 - fd / 45, 0, 1) * 0.1, now, 0.3);
  AUD.crickG.gain.setTargetAtTime(smoothstep(0.5, 1, night) * 0.012 * (0.5 + 0.5 * Math.sin(now * 0.7)), now, 0.4);
  if (now > AUD.nextBird) {
    AUD.nextBird = now + 1.2 + Math.random() * 4;
    if (day > 0.25 && Math.random() < 0.8) chirp(now + 0.05, Math.random() * 1.6 - 0.8, 2600 + Math.random() * 1800);
    if (day > 0.25 && seaK > 0.3 && Math.random() < 0.25) gullCall(now + 0.2, Math.random() * 1.6 - 0.8);
  }
  if (AUD.music) {
    if (now > AUD.nextChord) {
      const chords = [[57, 64, 69], [53, 60, 65], [55, 62, 67], [52, 59, 64]];
      pad(now + 0.1, chords[AUD.chord % chords.length], 9.5);
      AUD.chord++;
      AUD.nextChord = now + 8;
    }
    if (now > AUD.nextNote) {
      AUD.nextNote = now + 0.9 + Math.random() * 2.4;
      const oct = 72 + (Math.random() < 0.3 ? 12 : 0);
      note(now + 0.05, oct + PENTA[Math.floor(Math.random() * 5)] - 3, 2.8, 0.05 + Math.random() * 0.04);
    }
  }
}

function showError(msg) {
  const e = $('err');
  if (!e) return;
  e.style.display = 'block';
  e.textContent += msg + '\n';
}
addEventListener('error', (e) => showError(String(e.message || e)));
addEventListener('unhandledrejection', (e) => showError(String(e.reason && e.reason.stack || e.reason)));
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  const log = gl.getProgramInfoLog(program) + '\n' + gl.getShaderInfoLog(vs) + '\n' + gl.getShaderInfoLog(fs);
  let ctx = '';
  for (const [sh, name] of [[vs, 'VS'], [fs, 'FS']]) {
    const info = gl.getShaderInfoLog(sh) || '';
    const m = info.match(/ERROR: 0:(\d+)/);
    if (m) {
      const src = gl.getShaderSource(sh).split('\n');
      const ln = +m[1];
      ctx += `\n[${name} ${ln}] ` + src.slice(Math.max(0, ln - 3), ln + 1).join('\n');
    }
  }
  showError('Shader error: ' + log.slice(0, 1200) + ctx);
  console.error(log);
};

const clockState = { last: performance.now(), t: 0, fpsAcc: 0, fpsN: 0, fpsShown: 0, slow: 0, checked: false };

function updateShadowCamera() {
  const cam = camera.position;
  const R = clamp(cam.y * 1.4 + 75, 75, 420);
  const d = new THREE.Vector3();
  camera.getWorldDirection(d);
  d.y = 0; if (d.lengthSq() < 1e-4) d.set(0, 0, -1); d.normalize();
  const focus = new THREE.Vector3(cam.x + d.x * R * 0.55, 0, cam.z + d.z * R * 0.55);
  focus.y = Math.max(0, heightAt(focus.x, focus.z));
  const L = G.uSunDir.value;
  // snap focus to shadow texel grid (in light space) to avoid shimmering
  const texel = (2 * R) / sunLight.shadow.mapSize.x;
  const m = new THREE.Matrix4().lookAt(new THREE.Vector3(0, 0, 0), L.clone().negate(), new THREE.Vector3(0, 1, 0));
  const inv = m.clone().invert();
  const f = focus.clone().applyMatrix4(inv);
  f.x = Math.round(f.x / texel) * texel;
  f.y = Math.round(f.y / texel) * texel;
  focus.copy(f.applyMatrix4(m));
  sunLight.target.position.copy(focus);
  sunLight.position.copy(focus).addScaledVector(L, 1200);
  const sc = sunLight.shadow.camera;
  if (sc.right !== R) {
    sc.left = -R; sc.right = R; sc.top = R; sc.bottom = -R;
    sc.near = 10; sc.far = 2600;
    sc.updateProjectionMatrix();
  }
  sunLight.shadow.normalBias = texel * 1.2;
  sunLight.shadow.bias = -0.00025;
  sunLight.target.updateMatrixWorld();
}

function onResize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2) * Qs.pr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  if (composer) composer.setSize(size.x, size.y);
  resizeReflection();
}
addEventListener('resize', onResize);

function setQuality(name) {
  qualityName = name;
  Qs = QUALITY[name];
  sunLight.shadow.mapSize.set(Qs.shadow, Qs.shadow);
  if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
  skyMat.uniforms.uCloudSteps.value = Qs.cloudSteps;
  raysPass.maskMat.defines.SAMPLES = Qs.rays;
  raysPass.maskMat.needsUpdate = true;
  const rt1 = composer.renderTarget1, rt2 = composer.renderTarget2;
  rt1.samples = Qs.msaa; rt2.samples = Qs.msaa;
  rt1.dispose(); rt2.dispose();
  if (typeof applyDensity === 'function') applyDensity();
  onResize();
  document.querySelectorAll('#qual button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.q === name)));
}

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - clockState.last) / 1000;
  clockState.last = now;
  dt = Math.min(dt, 0.066);
  clockState.t += dt;
  const t = clockState.t;
  G.uTime.value = t;
  const w = G.uWind.value;
  w.w += dt * (1.5 + 9 * w.z);
  G.uCloudOff.value.x += dt * w.x * (6 + 14 * w.z);
  G.uCloudOff.value.y += dt * w.y * (6 + 14 * w.z);

  updateSky(dt);
  if (skyState.envDirty) { updateEnv(); skyState.envDirty = false; }
  updateControls(dt);
  camera.updateMatrixWorld();
  skyMesh.position.copy(camera.position);
  updateShadowCamera();
  if (typeof updateWorld === 'function') updateWorld(dt, t);
  updatePost(t);
  renderer.shadowMap.needsUpdate = true;
  renderReflection();
  composer.render(dt);
  if (typeof updateHud === 'function') updateHud(dt);

  // fps + one-time adaptive quality step down
  clockState.fpsAcc += dt; clockState.fpsN++;
  if (clockState.fpsAcc > 0.5) {
    const fps = clockState.fpsN / clockState.fpsAcc;
    clockState.fpsShown = fps;
    const el = $('fps'); if (el) el.textContent = fps.toFixed(0) + ' fps';
    clockState.fpsAcc = 0; clockState.fpsN = 0;
    if (!clockState.checked && t > 4) {
      if (fps < 24) clockState.slow++; else clockState.slow = 0;
      if (clockState.slow >= 4) {
        clockState.checked = true;
        const order = ['ultra', 'high', 'medium', 'low'];
        const i = order.indexOf(qualityName);
        if (i < order.length - 1) { setQuality(order[i + 1]); showHint('부드럽게 보이도록 그래픽 품질을 한 단계 낮췄어요'); }
      }
      if (t > 20) clockState.checked = true;
    }
  }
}

async function boot() {
  await step('물결과 구름 무늬 짜는 중', buildTextures);
  await step('지형 다듬는 중', buildHeightmap);
  await step('풀밭과 모래밭 나누는 중', buildNaturalMask);
  if (typeof buildCity === 'function') await step('도시 짓는 중', buildCity);
  await step('지형 조각 잇는 중', buildTerrain);
  await step('먼 산맥 그리는 중', buildFarMountains);
  await step('하늘 여는 중', buildSky);
  await step('바다 채우는 중', () => { buildWater(); if (typeof buildPools === 'function') buildPools(); });
  if (typeof buildNature === 'function') await step('나무 심는 중', buildNature);
  if (typeof buildLife === 'function') await step('새와 물고기 부르는 중', buildLife);
  finishMask();
  await step('빛과 공기 맞추는 중', () => { initEnv(); buildPost(); initControls(); });
  if (typeof initUI === 'function') initUI();
  updateSky(0);
  updateEnv();
  skyState.envDirty = false;
  await step('셰이더 준비 중', async () => {
    try { if (renderer.compileAsync) await renderer.compileAsync(scene, camera); } catch (_) { /* compile lazily */ }
  });
  requestAnimationFrame((n) => { clockState.last = n; frame(n); });
  setTimeout(() => $('loader').classList.add('done'), 300);
  window.__yp = { goToView, setMode, skyState, camera, CTRL, setQuality, G, postState, THREE, VIEWS };
  window.__ready = true;
}
boot();

</script>
